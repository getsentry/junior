kind: notice
source: notice
hit: first
doc: design/inbox-kinds.md
inputs:
  dismissed:
    values: bool
    phrases:
      true: a person dismissed it
      false: nobody dismissed it
  viewer.assignee:
    values: bool
    phrases:
      true: { is: they are an assignee, who: an assignee }
      false: they are not an assignee
rules:
  - id: notice-closed
    rows:
      - when: { dismissed: true }
        output: { close: dismissed }
  - id: notice-show
    rows:
      - when: { viewer.assignee: true }
        output: { notice: { step: with its step } }
