kind: github:pull_request
source: github.pull_request
hit: first
doc: design/github.md
code: packages/junior-github/src/webhooks/pull-request-kind.generated.ts
inputs:
  state:
    values: [open, merged, closed]
    phrases:
      open: it is open
      merged: it merged
      closed: it closed
  draft:
    values: bool
    phrases:
      true: it is a draft
      false: it is not a draft
  auto_merge:
    values: bool
    phrases:
      true: auto-merge is on
      false: auto-merge is off
  review_pending:
    values: bool
    phrases:
      true: a review is pending
      false: no review is pending
  merge_state:
    values: [clean, conflict, blocked, unknown]
    phrases:
      clean: GitHub reports that it can merge
      conflict: it has a merge conflict
      blocked: GitHub blocks the merge
      unknown: GitHub still computes its merge state
  review_outcome:
    values: [approved, changes_requested, none]
    phrases:
      approved: it is approved
      changes_requested:
        is: a reviewer requests changes
        not: no reviewer requests changes
      none: no review decides it
  viewer.requester:
    values: bool
    phrases:
      true: { is: they are the requester, who: the requester }
      false: { is: they are not the requester, who: a reviewer }
  viewer.requested:
    values: bool
    phrases:
      true: GitHub still requests their review
      false: GitHub does not request their review
  viewer.asked_again:
    values: bool
    phrases:
      true: >-
        Junior handled every comment of their change request, the required
        checks pass, they did not approve after it, and they did not comment
        or review after Junior asked
      false: Junior does not ask them to review again
    text: >-
      Junior handled every comment of the viewer's change request, the
      required checks pass, and Junior asks for their review again in this
      read. The source applies the guards of `pr-review-again`: it asks only
      while the viewer's latest review still requests changes, so a viewer
      who approved since is not asked, and it drops the ask once the viewer
      comments or reviews after it.
  viewer.requests_changes:
    values: bool
    phrases:
      true: a change request is open
      false: no change request is open
  viewer.replied:
    values: bool
    phrases:
      true: they commented or reviewed last
      false: they did not comment or review last
  viewer.shown:
    values: [nothing, merge, review]
    phrases:
      nothing: they have no output
      merge: they have "Ready to merge"
      review: they have "Review requested"
commands:
  remove-reviewer: removes them from the reviewers on GitHub
rules:
  - id: pr-ended
    rows:
      - when: { state: merged }
        output: { close: done }
      - when: { state: closed }
        output: { close: dismissed }
  - id: pr-merge
    rows:
      - when:
          state: open
          draft: false
          auto_merge: false
          review_pending: false
          merge_state: clean
          review_outcome: not(changes_requested)
          viewer.requester: true
        output: { ask: { label: Ready to merge } }
      - when:
          state: open
          draft: false
          auto_merge: false
          review_pending: false
          merge_state: unknown
          viewer.shown: merge
        output: keep
      - when:
          state: open
          draft: false
          auto_merge: false
          review_pending: false
          merge_state: unknown
          viewer.asked_again: false
        output: keep
  - id: pr-merge-reviewer
    rows:
      - when:
          review_outcome: approved
          merge_state: clean
          draft: false
          auto_merge: false
          viewer.requested: true
          viewer.requester: false
        output: { ask: { label: Ready to merge } }
  - id: pr-review-again
    rows:
      - when:
          viewer.asked_again: true
          viewer.requester: true
        output: { ask: { label: Review requested } }
  - id: pr-review
    rows:
      - when: { viewer.requested: true, viewer.requester: false }
        output: { ask: { label: Review requested, dismiss: remove-reviewer } }
      - when: { viewer.requested: true, viewer.requests_changes: false }
        output: { ask: { label: Review requested, dismiss: remove-reviewer } }
      - when: { viewer.requested: true, viewer.replied: false }
        output: { ask: { label: Review requested, dismiss: remove-reviewer } }
