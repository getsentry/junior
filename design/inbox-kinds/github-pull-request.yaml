kind: github:pull_request
source: github.pull_request
hit: first
doc: design/github.md
code: packages/junior-github/src/webhooks/pull-request-kind.generated.ts
inputs:
  state: [open, merged, closed]
  draft: bool
  auto_merge: bool
  review_pending: bool
  merge_state: [clean, conflict, blocked, unknown]
  review_outcome: [approved, changes_requested, none]
  viewer.requester: bool
  viewer.requested: bool
  viewer.asked_again:
    values: bool
    text: >-
      Junior handled every comment of the viewer's change request, the
      required checks pass, and Junior asks for their review again in this
      read. The source applies the guards of `pr-review-again`: it asks only
      while the viewer's latest review still requests changes, so a viewer
      who approved since is not asked, and it drops the ask once the viewer
      comments or reviews after it.
  viewer.requests_changes: bool
  viewer.replied: bool
  viewer.shown: [nothing, merge, review]
rules:
  - id: pr-ended
    text: When it merged or closed, nobody gets it.
    rows:
      - when: { state: merged }
        output: { close: done }
      - when: { state: closed }
        output: { close: dismissed }
  - id: pr-merge
    text: >-
      When it is open, not a draft, auto-merge is off, no review is pending,
      its merge state is clean, and no reviewer requests changes, the
      requester gets "Ready to merge".
    rows:
      - when:
          viewer.requester: true
          state: open
          draft: false
          auto_merge: false
          review_pending: false
          merge_state: clean
          review_outcome: not(changes_requested)
        output: { ask: { label: Ready to merge } }
      - when:
          state: open
          draft: false
          auto_merge: false
          review_pending: false
          merge_state: unknown
          viewer.shown: merge
        output: keep
      - when:
          state: open
          draft: false
          auto_merge: false
          review_pending: false
          merge_state: unknown
          viewer.asked_again: false
        output: keep
  - id: pr-merge-reviewer
    text: >-
      When it is approved, GitHub reports that it can merge, and it is not a
      draft, a reviewer whose review GitHub still requests gets "Ready to
      merge".
    rows:
      - when:
          viewer.requester: false
          viewer.requested: true
          draft: false
          auto_merge: false
          merge_state: clean
          review_outcome: approved
        output: { ask: { label: Ready to merge } }
  - id: pr-review-again
    text: >-
      When Junior handled every comment of the requester's change request and
      the required checks pass, the requester gets "Review requested". A
      requester who approved since is not asked. When the requester comments
      or reviews after that, Junior acts next, and they no longer get it.
    rows:
      - when:
          viewer.requester: true
          viewer.asked_again: true
        output: { ask: { label: Review requested } }
  - id: pr-review
    text: >-
      When GitHub requests the viewer's review, they get "Review requested".
      Dismiss removes them from the reviewers on GitHub. For the requester,
      their reply after their own change request ends it, because Junior acts
      next.
    rows:
      - when: { viewer.requested: true, viewer.requester: false }
        output: { ask: { label: Review requested, dismiss: remove-reviewer } }
      - when: { viewer.requested: true, viewer.requests_changes: false }
        output: { ask: { label: Review requested, dismiss: remove-reviewer } }
      - when: { viewer.requested: true, viewer.replied: false }
        output: { ask: { label: Review requested, dismiss: remove-reviewer } }
