kind: question
source: question
hit: first
doc: design/inbox-kinds.md
inputs:
  state:
    values: [open, answered, dismissed]
    phrases:
      open: nobody answered or dismissed it
      answered: a person answered it
      dismissed: a person dismissed it
  viewer.assignee:
    values: bool
    phrases:
      true: { is: they are an assignee, who: an assignee }
      false: they are not an assignee
rules:
  - id: question-closed
    rows:
      - when: { state: answered }
        output: { close: done }
      - when: { state: dismissed }
        output: { close: dismissed }
  - id: question-ask
    rows:
      - when: { viewer.assignee: true }
        output: { ask: { content: "the question, with its form" } }
