id: no-raw-external-image-src
language: Tsx
severity: error
message: Serve an external image through the Junior image route (`/api/images/...`), not from its own host. A raw external `src` sends the IP address and referrer of each viewer to that host. Use a path that the API returns, or a same-origin asset.
files:
  - packages/junior-dashboard/src/**/*.tsx
rule:
  kind: jsx_attribute
  all:
    - has:
        kind: property_identifier
        regex: ^(src|srcSet)$
    - has:
        any:
          - kind: string
            regex: ^["']\s*(https?:)?//
          - kind: jsx_expression
            has:
              any:
                - kind: string
                  regex: ^["']\s*(https?:)?//
                - kind: template_string
                  regex: ^`\s*(https?:)?//
  inside:
    any:
      - kind: jsx_opening_element
      - kind: jsx_self_closing_element
    has:
      field: name
      regex: ^(img|source|.*Image)$
