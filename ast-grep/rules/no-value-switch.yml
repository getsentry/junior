# A switch whose cases only return a value is a lookup table. A map checked
# with `satisfies` reads as data and still fails to compile when a key is
# missing. Switches that run different code per case stay: a case with
# other statements, or one that returns a call to a plain function, does not
# match. Eight cases with a body is the threshold; small switches are fine.
id: no-value-switch
language: TypeScript
severity: error
message: "This switch only returns a value for each case. Replace it with a map checked by `satisfies Record<Key, Value>`, or by a mapped type of per-type functions when a value needs the narrowed object, so a missing key still fails to compile. Check an untrusted key with `Object.hasOwn` before you index the map. Keep a switch only when its cases run different code."
files:
  - packages/*/src/**/*.ts
rule:
  kind: switch_statement
  has:
    field: body
    all:
      - has:
          kind: switch_case
          nthChild:
            position: 8
            ofRule: { kind: switch_case, has: { field: body, regex: "." } }
      - not:
          has:
            kind: switch_case
            has:
              field: body
              not:
                any:
                  - kind: return_statement
                  - kind: comment
                  - all:
                      - kind: statement_block
                      - not:
                          has:
                            not:
                              any:
                                - kind: lexical_declaration
                                - kind: return_statement
                                - kind: comment
                                - regex: "^[{}]$"
      - not:
          has:
            kind: switch_case
            has:
              field: body
              kind: return_statement
              has:
                kind: call_expression
                has: { field: function, kind: identifier }
