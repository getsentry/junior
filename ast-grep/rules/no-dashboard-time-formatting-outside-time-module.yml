id: no-dashboard-time-formatting-outside-time-module
language: TypeScript
severity: error
message: Format dashboard dates, times, and durations with packages/junior-dashboard/src/client/time.ts. It keeps every label in English and in the dashboard timezone.
files:
  - packages/junior-dashboard/src/client/**/*.ts
  - packages/junior-dashboard/src/client/**/*.tsx
ignores:
  - packages/junior-dashboard/src/client/time.ts
rule:
  any:
    - pattern: new Intl.DateTimeFormat($$$)
    - pattern: Intl.DateTimeFormat($$$)
    - pattern: new Intl.RelativeTimeFormat($$$)
    - pattern: new Intl.DurationFormat($$$)
    - pattern: $DATE.toLocaleDateString($$$)
    - pattern: $DATE.toLocaleTimeString($$$)
