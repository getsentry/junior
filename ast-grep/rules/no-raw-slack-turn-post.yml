id: no-raw-slack-turn-post
language: TypeScript
severity: error
message: "Do not post to Slack with thread.post. Post visible Turn output with sendSlackReply from packages/junior/src/chat/slack/reply.ts, and get its channel and thread from resolveSlackReplyTarget. A raw post skips the Conversation footer and chooses its own thread. Post a private notice with postSlackDirectMessage or postSlackEphemeralMessage from packages/junior/src/chat/slack/outbound.ts. Only when the post cannot go through either, put `// ast-grep-ignore: no-raw-slack-turn-post -- <why it cannot>` on the line before it."
# `thread` is a Chat SDK Thread parameter, not an import, so junior/restricted-call
# cannot resolve it. That oxlint rule owns postSlackMessage and chat.postMessage.
files:
  - packages/junior/src/**/*.ts
rule:
  pattern: $THREAD.post($$$)
constraints:
  THREAD:
    # Any Chat SDK Thread variable, such as `thread` or `args.slackThread`.
    regex: (?i)thread$
