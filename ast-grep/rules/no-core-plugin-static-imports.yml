id: no-core-plugin-static-imports
language: TypeScript
severity: error
message: Core @sentry/junior must not statically import plugin packages. Plugins load through package discovery in packages/junior/src/chat/plugins/package-discovery.ts. If core needs plugin behavior, add a small provider-neutral contract to @sentry/junior-plugin-api and let the plugin implement it. See policies/provider-boundaries.md.
files:
  - packages/junior/src/**/*.ts
  - packages/junior/src/**/*.tsx
rule:
  all:
    - kind: import_statement
    - has:
        kind: string
        regex: '^["@'']@sentry/junior-.+["@'']$'
    - not:
        has:
          kind: string
          regex: '^["@'']@sentry/junior-plugin-api["@'']$'
