id: no-host-globals-in-core
language: TypeScript
severity: error
message: "Core must not read the host's process globals. Take the value from engineCtx (EngineContext in packages/junior/src/core/engine-context.ts), and let the host set it in packages/junior/src/turn-steps/engine-context.ts."
files:
  - packages/junior/src/core/**/*.ts
rule:
  any:
    - kind: identifier
    - kind: property_identifier
    - kind: shorthand_property_identifier_pattern
  regex: ^(getQueueProvider|getChatConfig|getSqlExecutor|SERVICE_INSTANCE_ID)$
