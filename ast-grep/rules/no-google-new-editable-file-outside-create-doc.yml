id: no-google-new-editable-file-outside-create-doc
language: TypeScript
severity: error
message: newEditableFile skips the requester edit check. Only createGoogleDoc may call it, for the Doc it just created. Use requireEditableFile for an existing file.
files:
  - packages/junior-google/src/**/*.ts
ignores:
  - packages/junior-google/src/tools/create-doc.ts
rule:
  pattern: newEditableFile($$$ARGS)
