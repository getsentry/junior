id: no-secret-env-reads-outside-secrets-module
language: TypeScript
severity: error
message: Only packages/junior/src/chat/secrets.ts may read signing and encryption secrets from process.env. Import a reader from "@/chat/secrets".
files:
  - packages/junior/src/**/*.ts
  - packages/junior/src/**/*.tsx
ignores:
  - packages/junior/src/chat/secrets.ts
rule:
  any:
    - pattern: process.env.$NAME
    - pattern: process.env[$KEY]
constraints:
  NAME:
    regex: ^(JUNIOR_SECRET|BETTER_AUTH_SECRET|JUNIOR_SCHEDULER_SECRET|CRON_SECRET|JUNIOR_WEB_PUSH_PRIVATE_KEY|JUNIOR_ENCRYPTION_KEYS|JUNIOR_ENCRYPTION_KEY_ID)$
  KEY:
    regex: ^["'`](JUNIOR_SECRET|BETTER_AUTH_SECRET|JUNIOR_SCHEDULER_SECRET|CRON_SECRET|JUNIOR_WEB_PUSH_PRIVATE_KEY|JUNIOR_ENCRYPTION_KEYS|JUNIOR_ENCRYPTION_KEY_ID)["'`]$
