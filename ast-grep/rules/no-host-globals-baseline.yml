rule:
  any:
    - any:
        - kind: identifier
        - kind: property_identifier
        - kind: shorthand_property_identifier_pattern
      # Getters and globals that give the app context, the config, or a
      # process store or client: SQL, state and Redis, queues, sandbox,
      # attachments, Slack.
      regex: ^(getAppContext|installAppContext|getChatConfig|installChatConfig|botConfig|getSqlExecutor|getDb|getConversationStore|getConversationEventStore|getConversationMessageSearchStore|getTurnLifecycle|getStateAdapter|getConnectedStateContext|getDefaultRedisStateAdapterFor|getQueueProvider|getVercelConversationWorkQueue|getSandboxProvider|getAttachmentStorage|getProductionSlackAdapter|SERVICE_INSTANCE_ID)$
    - any:
        - kind: identifier
        - kind: property_identifier
        - kind: shorthand_property_identifier_pattern
      # Functions that only read one of those globals, so they are the same
      # global under another name.
      regex: ^(getPlugins|getRegistrations|getEventCatalog|getSlackBotToken|getSlackSigningSecret|getSlackClientId|getSlackClientSecret|getSlackReactionConfig|getRuntimeMetadata|getConfigDefaults|isExperimentalFeatureEnabled|isEventEmbeddingsEnabled|isVisionEnabled|isWorkloadIdentityProvider|shouldEmitDevAgentTrace|dockerSandboxExtraCaFile|memoryRegistration|getConversationContextCompactionTriggerTokens)$
    # Other code uses `defaultTimezone` as a field name, so match only the
    # function itself.
    - kind: identifier
      regex: ^defaultTimezone$
