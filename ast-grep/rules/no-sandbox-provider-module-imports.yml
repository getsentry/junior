id: no-sandbox-provider-module-imports
language: TypeScript
severity: error
message: Only packages/junior/src/chat/sandbox/provider.ts may import a sandbox provider module such as chat/sandbox/vercel/. Other code calls getSandboxProvider(). See packages/junior/src/chat/sandbox/README.md.
files:
  - packages/junior/src/**/*.ts
  - packages/junior/src/**/*.tsx
ignores:
  - packages/junior/src/chat/sandbox/provider.ts
  - packages/junior/src/chat/sandbox/vercel/**
rule:
  any:
    - kind: import_statement
    - kind: export_statement
  has:
    kind: string
    regex: '^["''](@/chat/sandbox/vercel|(\.{1,2}/)+(.+/)?sandbox/vercel)(/.*)?["'']$'
---
