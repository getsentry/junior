id: no-queue-provider-module-imports
language: TypeScript
severity: error
message: Only packages/junior/src/chat/queue/provider.ts may import a queue provider module such as chat/queue/vercel.ts. Other code calls getQueueProvider(). See packages/junior/src/chat/queue/README.md.
files:
  - packages/junior/src/**/*.ts
  - packages/junior/src/**/*.tsx
ignores:
  - packages/junior/src/chat/queue/provider.ts
rule:
  any:
    - kind: import_statement
    - kind: export_statement
  has:
    kind: string
    regex: '^["''](@/chat/queue/vercel|(\.{1,2}/)+(.+/)?queue/vercel)["'']$'
