id: no-google-new-editable-file-outside-file-creators
language: TypeScript
severity: error
message: newEditableFile skips the requester edit check. Only a tool that just created the file may call it, for that file. Use requireEditableFile for an existing file.
files:
  - packages/junior-google/src/**/*.ts
ignores:
  - packages/junior-google/src/tools/create-doc.ts
  - packages/junior-google/src/tools/slide-images.ts
rule:
  pattern: newEditableFile($$$ARGS)
