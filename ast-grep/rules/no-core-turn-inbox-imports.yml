# The core Turn flow writes only Conversation data, such as
# `junior_questions`, and never calls the Inbox. The Inbox follows that data
# after the commit, through `reactToConversationChange` in
# `chat/conversations/change-reactions.ts`. The core Turn flow is the agent
# loop and what runs a Turn: its tools and prompt inputs, its Conversation
# state and questions, and its stop.
id: no-core-turn-inbox-imports
language: TypeScript
severity: error
message: The core Turn flow must not import the Inbox. Write Conversation data, such as a question, and let the Inbox react after the commit through reactToConversationChange in chat/conversations/change-reactions.ts.
files:
  - packages/junior/src/core/**/*.ts
  - packages/junior/src/chat/agent/**/*.ts
  - packages/junior/src/chat/task-execution/**/*.ts
  - packages/junior/src/chat/providers/**/*.ts
  - packages/junior/src/chat/runtime/**/*.ts
  - packages/junior/src/chat/questions/**/*.ts
  - packages/junior/src/chat/state/**/*.ts
  - packages/junior/src/chat/tool-support/**/*.ts
  - packages/junior/src/chat/conversations/change-reactions.ts
  - packages/junior/src/chat/conversations/session-stop.ts
ignores:
  # The tool composition roots. `tool-composition-inbox-tools-only` limits
  # them to the Inbox tools.
  - packages/junior/src/chat/tool-support/create-tools.ts
  - packages/junior/src/chat/tool-support/registry.ts
rule:
  any:
    - kind: import_statement
      has:
        kind: string
        matches: inbox-module
    - kind: export_statement
      has:
        kind: string
        matches: inbox-module
    - pattern: import($MODULE)
constraints:
  MODULE:
    matches: inbox-module
utils:
  inbox-module:
    regex: ^["'](@/chat/(inbox-items|inbox-snoozes)(/|["'])|@/chat/(notifications|slack)/inbox-item|(\.\.?/)+(inbox-items|inbox-snoozes)(/|["']))
