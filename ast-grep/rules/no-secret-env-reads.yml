id: no-secret-env-reads
language: TypeScript
severity: error
message: "Do not read signing and encryption secrets from process.env. loadConfig reads them from the env that it receives. Read them from the config in the app context that the caller passes in. See policies/interface-design.md."
files:
  - packages/junior/src/**/*.ts
  - packages/junior/src/**/*.tsx
rule:
  any:
    - pattern: process.env.$NAME
    - pattern: process.env[$KEY]
constraints:
  NAME:
    regex: ^(JUNIOR_SECRET|BETTER_AUTH_SECRET|JUNIOR_SCHEDULER_SECRET|CRON_SECRET|JUNIOR_WEB_PUSH_PRIVATE_KEY|JUNIOR_ENCRYPTION_KEYS|JUNIOR_ENCRYPTION_KEY_ID)$
  KEY:
    regex: ^["'`](JUNIOR_SECRET|BETTER_AUTH_SECRET|JUNIOR_SCHEDULER_SECRET|CRON_SECRET|JUNIOR_WEB_PUSH_PRIVATE_KEY|JUNIOR_ENCRYPTION_KEYS|JUNIOR_ENCRYPTION_KEY_ID)["'`]$
