id: no-imperative-log-event-outcomes
language: TypeScript
severity: error
message: >-
  The last segment of a log event name is an observed outcome, not a base verb
  (retry, fail, warn, wrap_up) or a direction (in, out). Use a past participle
  (failed, skipped, wrapped_up), an in-progress participle (retrying), or a
  state (missing, timed_out). Example: agent.turn.provider.retrying, not
  agent.turn.provider.retry. A captured exception ends in .failed. Observed
  outcomes keep telemetry consistent, so one query finds every event with the
  same outcome.
files:
  - packages/junior/src/**/*.ts
  - packages/junior/src/**/*.tsx
rule:
  matches: log-event-name
  any:
    - regex: '\.([a-z0-9_]*_)?(retry|start|complete|fail|reject|skip|yield|unlink|warn)["'']$'
    - regex: '\.(in|out|fallback|wrap_up)["'']$'
