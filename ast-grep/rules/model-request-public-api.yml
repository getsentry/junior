id: model-request-public-api
language: TypeScript
severity: error
message: "Host code builds model requests only through the public API in packages/junior/src/core/model/request.ts. core/model/assemble.ts and core/model/diagnostics.ts belong to core."
files:
  - packages/junior/src/**/*.ts
  - packages/junior/src/**/*.tsx
ignores:
  - packages/junior/src/core/**
rule:
  any:
    - kind: import_statement
    - kind: export_statement
  has:
    kind: string
    regex: '^["''](@/core/model/(assemble|diagnostics)|(\.{1,2}/)+(.+/)?core/model/(assemble|diagnostics))["'']$'
