id: no-slack-thread-from-conversation-id
language: TypeScript
severity: error
message: "Do not parse a Conversation id to find a Slack channel or thread. A Conversation that owns a Slack thread, such as an Automation run, has an id that is not a Slack thread id. Get the place to post from resolveSlackReplyTarget in packages/junior/src/chat/slack/reply.ts. If the code reads a Slack-native Thread.id, or only builds a label or link, put `// ast-grep-ignore: no-slack-thread-from-conversation-id -- <reason>` on the line before it. Do not add the file to this rule's ignores; they are only for the module that owns the Slack thread id format."
files:
  - packages/junior/src/**/*.ts
rule:
  pattern: parseSlackThreadId($$$)
