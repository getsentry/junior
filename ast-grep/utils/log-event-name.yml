# The string literal event name passed to a Junior logging helper. Event
# names built at runtime are not matched.
id: log-event-name
language: TypeScript
rule:
  kind: string
  any:
    - nthChild: 1
      inside:
        kind: arguments
        inside:
          kind: call_expression
          has:
            field: function
            regex: '(^|\.)log(Info|Warn|Error)$'
    - nthChild: 2
      inside:
        kind: arguments
        inside:
          kind: call_expression
          has:
            field: function
            regex: '(^|\.)logException$'
