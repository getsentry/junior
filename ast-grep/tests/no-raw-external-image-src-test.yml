id: no-raw-external-image-src
valid:
  - '<img alt="" src={actor.avatarUrl} />'
  - '<img alt="" src="/junior-logo.svg" />'
  - "<AvatarImage src={`/api/images/${id}?w=128`} />"
  - '<a href="https://example.com/photo.png">Photo</a>'
invalid:
  - '<img alt="" src="https://example.com/photo.png" />'
  - '<img alt="" src={"//cdn.example.com/photo.png"} />'
  - "<AvatarImage src={`https://avatars.example.com/${id}.png`} />"
  - '<AvatarPrimitive.Image src="http://example.com/a.png" />'
  - '<img alt="" srcSet="https://example.com/a.png 2x" />'
