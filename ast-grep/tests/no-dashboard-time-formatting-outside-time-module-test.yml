id: no-dashboard-time-formatting-outside-time-module
valid:
  - 'const label = formatTime(value, { month: "short" });'
  - "const parts = dateTimeFormat({ timeZone }).formatToParts(time);"
  - 'const count = total.toLocaleString("en-US");'
invalid:
  - 'const label = new Intl.DateTimeFormat(undefined, { month: "short" }).format(time);'
  - "const zone = Intl.DateTimeFormat().resolvedOptions().timeZone;"
  - 'const label = new Intl.RelativeTimeFormat("en-US").format(-1, "day");'
  - 'const label = new Intl.DurationFormat("en-US").format({ hours: 1 });'
  - "const day = date.toLocaleDateString();"
  - "const clock = date.toLocaleTimeString(undefined, { hour: 'numeric' });"
