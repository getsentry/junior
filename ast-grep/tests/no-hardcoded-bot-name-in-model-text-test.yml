id: no-hardcoded-bot-name-in-model-text
valid:
  - 'const tool = { description: "Find open slots in your own calendar." };'
  - 'const input = z.string().describe("A channel name you already know.");'
  - 'throw new Error("Junior plugin manifest.name is required.");'
  - 'const fields = { description: "Login of the junior-event bot." };'
  - 'const input = z.object({ kind: z.literal("Junior") }).describe("The kind.");'
invalid:
  - 'const tool = { description: "Read events that Junior''s account can see." };'
  - "const tool = { description: `Find slots on Junior calendar ${zone}.` };"
  - 'const input = z.string().describe("A channel name Junior already knows.");'
  - 'const fields = { authors: { description: "bots such as Junior" } };'
  - 'const plugin = { instructions: "Junior must ask first." };'
