id: no-host-globals
valid:
  - "await engineCtx.queue.send(TURN_STEP_TOPIC, payload);"
  - "const owner = engineCtx.owner;"
  - "await findTurn(engineCtx, turnId);"
  - "const rows = await app.db.select().from(conversations);"
  - "const name = app.config.bot.userName;"
  - "const context = createAppContext({ plugins });"
  - "const timezone = args.intent.timezone ?? args.defaultTimezone;"
  - "return { defaultTimezone: timezone };"
