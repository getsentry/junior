  - 'import { SERVICE_INSTANCE_ID } from "@/deployment";'
  - 'const { getChatConfig } = await import("@/chat/config");'
  - "await queue.getQueueProvider();"
  - "const rows = await getDb().select().from(conversations);"
  - "const state = getStateAdapter();"
  - "const name = botConfig.userName;"
  - "const plugins = getAppContext().plugins;"
  - "const previous = installAppContext(context);"
  - "installChatConfig(config);"
  - "const store = getConversationStore();"
  - "const redis = await getDefaultRedisStateAdapterFor(adapter);"
  - "await getVercelConversationWorkQueue().send(message);"
  - "const sandbox = getSandboxProvider();"
  - "const token = getSlackBotToken();"
  - "const plugins = getPlugins();"
  - "for (const plugin of getRegistrations()) {}"
  - "const catalog = getEventCatalog();"
  - "const version = getRuntimeMetadata().version;"
