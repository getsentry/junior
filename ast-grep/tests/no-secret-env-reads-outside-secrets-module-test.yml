id: no-secret-env-reads-outside-secrets-module
valid:
  - "const secret = readJuniorSecret();"
  - "const key = process.env.JUNIOR_WEB_PUSH_PUBLIC_KEY?.trim();"
  - "const clientSecret = process.env.GOOGLE_CLIENT_SECRET;"
  - "env.JUNIOR_SECRET = localSecret;"
invalid:
  - "const secret = process.env.JUNIOR_SECRET?.trim();"
  - "const secret = process.env.BETTER_AUTH_SECRET ?? fallback;"
  - "const secret = process.env.CRON_SECRET;"
  - "const secret = process.env.JUNIOR_SCHEDULER_SECRET;"
  - "const key = process.env.JUNIOR_WEB_PUSH_PRIVATE_KEY;"
  - 'const secret = process.env["JUNIOR_SECRET"];'
