id: no-host-globals-in-core
valid:
  - "await engineCtx.queue.send(TURN_STEP_TOPIC, payload);"
  - "const owner = engineCtx.owner;"
  - "await findTurn(engineCtx, turnId);"
invalid:
  - 'import { getQueueProvider } from "@/chat/queue/provider";'
  - "await getQueueProvider().send(TURN_STEP_TOPIC, payload);"
  - "const seconds = getChatConfig().functionMaxDurationSeconds;"
  - "const executor = getSqlExecutor();"
  - 'import { SERVICE_INSTANCE_ID } from "@/deployment";'
  - 'const { getChatConfig } = await import("@/chat/config");'
  - "await queue.getQueueProvider();"
