id: no-raw-tool-definitions
valid:
  - "export const readFileTool = zodTool({ inputSchema, outputSchema, execute: async () => ({}) });"
  - "export const searchTool = definePluginTool({ inputSchema: schema, async execute() { return {}; } });"
