id: no-imperative-log-event-outcomes
valid:
  - 'logWarn("agent.turn.provider.retrying");'
  - 'logException(error, "slack.thread.post.failed", {});'
  - 'logException(error, "api.unhandled.exception");'
  - 'logInfo("agent.turn.limit.wrapped_up", {});'
  - 'logWarn("agent.turn.timed_out");'
  - 'logWarn("plugin.log.warning", {});'
  - 'logError("sandbox.workspace_snapshot.builder.delete_failed");'
  - 'retry("agent.turn.retry");'
invalid:
  - 'logWarn("agent.turn.provider.retry");'
  - 'logException(error, "slack.thread.post.fail");'
  - 'logInfo("agent.turn.limit.wrap_up");'
  - 'logWarn("plugin.log.warn", {});'
  - 'logWarn("agent.turn.no_progress_fail");'
  - 'logger.logInfo("sandbox.egress.request.out");'
  - 'logWarn("agent.turn.model.fallback");'
