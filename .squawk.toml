# Squawk lints migrations for statements that lock a table while they scan,
# rewrite, or build. `junior upgrade` runs each migration in a transaction
# with a lock_timeout (packages/junior/src/db/migrate.ts).
# scripts/check-migration-backfills.mjs checks UPDATE and DELETE.
pg_version = "17"
assume_in_transaction = true
excluded_rules = [
  # The runner bounds every lock wait, and the migration is retried.
  "require-lock-timeout",
  "require-statement-timeout",
  # A migration that only uses CREATE INDEX CONCURRENTLY runs outside a
  # transaction. The runner rejects one that mixes it with other statements.
  "ban-concurrent-index-creation-in-transaction",
  # DROP INDEX holds its lock only for an instant, like ADD COLUMN.
  "require-concurrent-index-deletion",
  # These rules are not about locks.
  "prefer-robust-stmts",
  "prefer-bigint-over-int",
  "prefer-bigint-over-smallint",
  "identifier-too-long",
  "ban-drop-column",
  "ban-drop-constraint",
  "ban-drop-function",
  "ban-drop-not-null",
  "ban-drop-table",
  "renaming-column",
  "renaming-object",
  "renaming-table",
]
# Shipped migrations already ran.
excluded_paths = [
  "packages/junior-github/migrations/0007_shallow_millenium_guard.sql",
  "packages/junior-memory/migrations/0001_closed_madrox.sql",
