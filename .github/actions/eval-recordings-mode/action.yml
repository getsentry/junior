name: Eval recordings mode
description: >
  Choose the recording mode of an eval run on a pull request. A run on a
  commit that the commit-eval-recordings action made uses strict `replay`:
  it proves that the committed recordings cover every model request. Other
  runs use `auto`. A run on a newer base than the recording run also uses
  `auto`, because changes on the base make new requests. See "Recordings"
  in packages/junior-evals/README.md.
inputs:
  suite:
    description: The eval suite, such as `integration`.
    required: true
outputs:
  mode:
    description: The value for VITEST_EVALS_REPLAY_MODE, `auto` or `replay`.
    value: ${{ steps.mode.outputs.mode }}
runs:
  using: composite
  steps:
    - id: mode
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        SUITE: ${{ inputs.suite }}
        PR: ${{ github.event.pull_request.number }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        TESTED_MERGE: ${{ github.sha }}
        BRANCH: ${{ github.event.pull_request.head.ref }}
        WORKFLOW_REF: ${{ github.workflow_ref }}
        RUN_ID: ${{ github.run_id }}
        PREFIX: "chore(evals): Update eval recordings"
      run: |
        set -euo pipefail
        if [[ -z "$PR" ]]; then
          echo "mode=auto" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        # The recording commits at the tested commit, newest first. The run
        # reads them from its own head SHA, not from the current branch: a
        # recording commit pushed after this run started must not change its
        # mode.
        sha="$HEAD_SHA"
        chain=""
        suite_base=""
        first_base=""
        for _ in $(seq 1 20); do
          commit="$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha")"
          message="$(jq -r .commit.message <<< "$commit")"
          [[ "$message" == "$PREFIX"* ]] || break
          chain+="$message"$'\n'
          commit_base="$(grep -m1 -o '^Eval-Base: [0-9a-f]*$' <<< "$message" || true)"
          # The newest commit of this suite. Other suites can commit on a
          # newer base, so their trailers do not apply to this suite.
          if [[ -z "$suite_base" ]] && grep -qx "Eval-Suite: $SUITE" <<< "$message"; then
            suite_base="${commit_base:-none}"
          fi
          # The oldest commit. Its run tested the last other commit.
          first_base="${commit_base:-none}"
          sha="$(jq -r '.parents[0].sha' <<< "$commit")"
        done
        if [[ -z "$chain" ]]; then
          echo "mode=auto" >> "$GITHUB_OUTPUT"
          echo "Eval recordings mode: auto" >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi
        # A run tests the pull request merged into its base. If the base
        # changed after the recording run of this suite, the recordings can
        # miss requests that only the new base makes. Record them. A suite
        # with no recordings commit uses the base of the oldest commit: the
        # runs of one push test the same merge commit, so its own run on the
        # last other commit tested that base. An `auto` run that records
        # nothing proves the same as a strict run.
        base="$(gh api "repos/$GITHUB_REPOSITORY/commits/$TESTED_MERGE" --jq '.parents[0].sha')"
        recorded_base="${suite_base:-$first_base}"
        if [[ "$recorded_base" != "Eval-Base: $base" ]]; then
          echo "mode=auto" >> "$GITHUB_OUTPUT"
          echo "Eval recordings mode: auto, because the base changed after the recording run" >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi
        echo "mode=replay" >> "$GITHUB_OUTPUT"
        echo "Eval recordings mode: replay, because the head is a recordings commit" >> "$GITHUB_STEP_SUMMARY"
        if grep -qx "Eval-Suite: $SUITE" <<< "$chain"; then
          exit 0
        fi
        # The recordings of this suite can still be on the way, because its
        # run on the last other commit is not done. Wait for that run. If it
        # commits recordings, the run on that commit cancels this one.
        workflow="$(basename "${WORKFLOW_REF%@*}")"
        for _ in $(seq 1 90); do
          pending="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?branch=$BRANCH&event=pull_request&per_page=30" |
            jq --arg prefix "$PREFIX" --argjson id "$RUN_ID" \
              '[.workflow_runs[] | select(.id != $id and .status != "completed" and (.head_commit.message | startswith($prefix) | not))] | length')"
          [[ "$pending" == "0" ]] && exit 0
          echo "Waiting for $pending earlier $SUITE run(s) to record."
          sleep 30
        done
        echo "::warning::Earlier $SUITE runs did not finish in 45 minutes."
