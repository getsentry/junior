name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump type (ignored when version is set). auto picks it from the commits; pre cuts a prerelease of that version.
        required: true
        type: choice
        default: auto
        options:
          - auto
          - pre
          - patch
          - minor
          - major
      version:
        description: Exact version override (for example, 0.212.0)
        required: false
        type: string
      force:
        description: Force release (bypass blockers)
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read
  # Craft writes AI changelog summaries with the workflow token.
  copilot-requests: write

jobs:
  release:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    name: Release a new version
    steps:
      - name: Get auth token
        id: token
        uses: actions/create-github-app-token@5d869da34e18e7287c1daad50e0b8ea0f506ce69 # v1.11.0
        with:
          app-id: ${{ vars.SENTRY_RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.SENTRY_RELEASE_BOT_PRIVATE_KEY }}
          permission-checks: read
          permission-issues: read
          permission-statuses: read
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ steps.token.outputs.token }}
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"

      - name: Prepare release
        uses: getsentry/craft@v3
        env:
          GITHUB_TOKEN: ${{ steps.token.outputs.token }}
        with:
          version: ${{ inputs.version || inputs.bump }}
          force: ${{ inputs.force }}
          llm_api_key: ${{ github.token }}
