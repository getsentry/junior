name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump type (ignored when version is set). auto picks it from the commits; pre cuts a prerelease of that version.
        required: true
        type: choice
        default: auto
        options:
          - auto
          - pre
          - patch
          - minor
          - major
      version:
        description: Exact version override (for example, 0.212.0)
        required: false
        type: string
      force:
        description: Force release (bypass blockers)
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read
  # Craft writes AI changelog summaries with the workflow token.
  copilot-requests: write

jobs:
  release:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    name: Release a new version
    steps:
      - name: Get auth token
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.SENTRY_RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.SENTRY_RELEASE_BOT_PRIVATE_KEY }}
          permission-checks: read
          # Craft reads release-blocker issues and opens the publish request in getsentry/publish.
          permission-issues: write
          permission-statuses: read
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          token: ${{ steps.token.outputs.token }}
          # Craft pushes the release branch with git.
          persist-credentials: true
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.22.1"

      - name: Prepare release
        uses: getsentry/craft@9567926a606072678ef367b02445c4f99f374795 # 3.11.2
        env:
          GITHUB_TOKEN: ${{ steps.token.outputs.token }}
        with:
          version: ${{ inputs.version || inputs.bump }}
          force: ${{ inputs.force }}
          llm_api_key: ${{ github.token }}
