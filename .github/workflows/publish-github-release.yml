name: Publish GitHub release

# Craft creates the approved tag through the GitHub API before it publishes npm.
on:
  create:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing approved release tag to retry (for example, 0.227.0)
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: github-release-${{ inputs.tag || github.event.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'getsentry/junior' && (github.event_name == 'workflow_dispatch' || github.event.ref_type == 'tag')
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ inputs.tag || github.event.ref }}
    steps:
      - name: Validate release tag
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Expected an exact release tag" >&2
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"

      - name: Download the checked CI artifact for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse HEAD)
          run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$sha" --event push --status success --json databaseId --jq '.[0].databaseId // empty')
          if [[ -z "$run" ]]; then
            echo "No successful push CI run for $sha. Do not rebuild release packages here." >&2
            exit 1
          fi
          gh run download "$run" --repo "$GITHUB_REPOSITORY" --name "$sha" --dir artifacts
          node scripts/release-artifacts.mjs verify artifacts

      # Use the app token so release.published can trigger downstream workflows.
      - name: Get release token
        id: token
        uses: actions/create-github-app-token@5d869da34e18e7287c1daad50e0b8ea0f506ce69 # v1.11.0
        with:
          app-id: ${{ vars.SENTRY_RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.SENTRY_RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: write

      - name: Verify and publish GitHub release
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: node scripts/publish-github-release.mjs "$RELEASE_TAG" artifacts
