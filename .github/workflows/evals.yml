name: Evals

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
    types:
      - opened
      - reopened
      - synchronize
      - labeled

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Aggregate floor for qualitative variability only. Integration and Guardian
# suites fail hard on any case miss. Infrastructure/setup failures remain hard
# failures for every suite.
env:
  EVAL_MIN_PASS_RATE: "0.8"

jobs:
  gate:
    name: evals / gate
    runs-on: blacksmith-4vcpu-ubuntu-2404
    outputs:
      gateway_ready: ${{ steps.secrets.outputs.gateway_ready }}
      guardian_file_changed: ${{ steps.changes.outputs.guardian_file_changed }}
      guardian_requested: ${{ steps.request.outputs.guardian_requested }}
      integration_file_changed: ${{ steps.changes.outputs.integration_file_changed }}
      integration_requested: ${{ steps.request.outputs.integration_requested }}
      qualitative_file_changed: ${{ steps.changes.outputs.qualitative_file_changed }}
      qualitative_requested: ${{ steps.request.outputs.qualitative_requested }}
      sandbox_ready: ${{ steps.secrets.outputs.sandbox_ready }}
      should_run_guardian: ${{ steps.decision.outputs.should_run_guardian }}
      should_run_integration: ${{ steps.decision.outputs.should_run_integration }}
      should_run_qualitative: ${{ steps.decision.outputs.should_run_qualitative }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: request
        run: |
          set -euo pipefail

          action="$(jq -r '.action // ""' "$GITHUB_EVENT_PATH")"
          label_name="$(jq -r '.label.name // ""' "$GITHUB_EVENT_PATH")"
          all_requested=false
          qualitative_requested=false
          integration_requested=false
          guardian_requested=false

          has_label() {
            local name="$1"
            jq -e --arg name "$name" '.pull_request.labels[]?.name | select(. == $name)' "$GITHUB_EVENT_PATH" >/dev/null
          }

          if [[ "$action" == "labeled" ]]; then
            case "$label_name" in
              trigger-evals)
                all_requested=true
                ;;
              trigger-evals-qualitative)
                qualitative_requested=true
                ;;
              trigger-evals-integration)
                integration_requested=true
                ;;
              trigger-evals-guardian)
                guardian_requested=true
                ;;
            esac
          else
            if has_label "trigger-evals"; then
              all_requested=true
            fi
            if has_label "trigger-evals-qualitative"; then
              qualitative_requested=true
            fi
            if has_label "trigger-evals-integration"; then
              integration_requested=true
            fi
            if has_label "trigger-evals-guardian"; then
              guardian_requested=true
            fi
          fi

          if [[ "$all_requested" == "true" ]]; then
            qualitative_requested=true
            integration_requested=true
            guardian_requested=true
          fi

          echo "qualitative_requested=$qualitative_requested" >> "$GITHUB_OUTPUT"
          echo "integration_requested=$integration_requested" >> "$GITHUB_OUTPUT"
          echo "guardian_requested=$guardian_requested" >> "$GITHUB_OUTPUT"

      - uses: getsentry/action-filter-paths@98a158469c63115591d1c2952d34450838ab3bc1 # v0.1.0
        id: changes
        with:
          filters: |
            qualitative_file_changed:
              - 'packages/junior-evals/evals/agent/**'
              - 'packages/junior-evals/evals/conversation/**'
              - 'packages/junior-evals/evals/event-tasks/**'
              - 'packages/junior-evals/evals/github/**'
              - 'packages/junior-evals/evals/memory/**'
              - 'packages/junior-evals/evals/scheduler/**'
              - 'packages/junior-evals/evals/sentry/**'
              - 'packages/junior-evals/package.json'
              - 'packages/junior-evals/global-setup.ts'
              - 'packages/junior-evals/postgres-global-setup.ts'
              - 'packages/junior-evals/src/behavior-harness.ts'
              - 'packages/junior-evals/src/eval-ai-gateway-dispatcher.ts'
              - 'packages/junior-evals/src/eval-context.ts'
              - 'packages/junior-evals/src/eval-egress.ts'
              - 'packages/junior-evals/src/eval-plugin-fixtures.ts'
              - 'packages/junior-evals/src/helpers.ts'
              - 'packages/junior-evals/src/setup.ts'
              - 'packages/junior-evals/src/slack-link.ts'
              - 'packages/junior-evals/src/snapshot-warmup.ts'
              - 'packages/junior-evals/tests/**'
              - 'packages/junior-evals/vitest.evals.config.ts'
              - 'packages/junior-evals/vitest.evals.qualitative.config.ts'
              - 'packages/junior/src/**'
            integration_file_changed:
              - 'packages/junior-evals/evals/integration/**'
              - 'packages/junior-evals/package.json'
              - 'packages/junior-evals/global-setup.ts'
              - 'packages/junior-evals/postgres-global-setup.ts'
              - 'packages/junior-evals/src/behavior-harness.ts'
              - 'packages/junior-evals/src/eval-ai-gateway-dispatcher.ts'
              - 'packages/junior-evals/src/eval-context.ts'
              - 'packages/junior-evals/src/eval-egress.ts'
              - 'packages/junior-evals/src/eval-plugin-fixtures.ts'
              - 'packages/junior-evals/src/helpers.ts'
              - 'packages/junior-evals/src/setup.ts'
              - 'packages/junior-evals/src/slack-link.ts'
              - 'packages/junior-evals/src/snapshot-warmup.ts'
              - 'packages/junior-evals/vitest.evals.integration.config.ts'
              - 'packages/junior/src/**'
            guardian_file_changed:
              - 'packages/junior-evals/evals/guardian/**'
              - 'packages/junior-evals/src/guardian-harness.ts'
              - 'packages/junior-evals/src/guardian-setup.ts'
              - 'packages/junior-evals/src/eval-ai-gateway-dispatcher.ts'
              - 'packages/junior-evals/guardian-global-setup.ts'
              - 'packages/junior-evals/vitest.evals.guardian.config.ts'
              - 'packages/junior-evals/package.json'
              - 'packages/junior/src/chat/services/guardian-action-policy.ts'
              - 'packages/junior/src/chat/services/guardian-action-review.ts'
              - 'packages/junior/src/chat/tool-support/action-review.ts'
              - 'packages/junior/src/chat/tool-support/action-review-evidence.ts'
              - 'packages/junior/src/chat/tool-support/action-review-history.ts'
              - 'packages/junior/src/chat/pi/client.ts'
              - 'packages/junior/src/chat/pi/gateway-auth.ts'
              - 'packages/junior/src/chat/config.ts'

      - id: secrets
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          VERCEL_OIDC_TOKEN: ${{ secrets.VERCEL_OIDC_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail

          if [[ -n "${AI_GATEWAY_API_KEY:-}" || -n "${VERCEL_OIDC_TOKEN:-}" ]]; then
            echo "gateway_ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "gateway_ready=false" >> "$GITHUB_OUTPUT"
          fi

          if [[ -n "${VERCEL_OIDC_TOKEN:-}" || ( -n "${VERCEL_TOKEN:-}" && -n "${VERCEL_TEAM_ID:-}" && -n "${VERCEL_PROJECT_ID:-}" ) ]]; then
            echo "sandbox_ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "sandbox_ready=false" >> "$GITHUB_OUTPUT"
          fi

      - id: decision
        env:
          GATEWAY_READY: ${{ steps.secrets.outputs.gateway_ready }}
          GUARDIAN_FILE_CHANGED: ${{ steps.changes.outputs.guardian_file_changed }}
          GUARDIAN_REQUESTED: ${{ steps.request.outputs.guardian_requested }}
          INTEGRATION_FILE_CHANGED: ${{ steps.changes.outputs.integration_file_changed }}
          INTEGRATION_REQUESTED: ${{ steps.request.outputs.integration_requested }}
          QUALITATIVE_FILE_CHANGED: ${{ steps.changes.outputs.qualitative_file_changed }}
          QUALITATIVE_REQUESTED: ${{ steps.request.outputs.qualitative_requested }}
          SANDBOX_READY: ${{ steps.secrets.outputs.sandbox_ready }}
        run: |
          set -euo pipefail

          should_run_qualitative=false
          if [[ "$GATEWAY_READY" == "true" && "$SANDBOX_READY" == "true" && ( "$QUALITATIVE_FILE_CHANGED" == "true" || "$QUALITATIVE_REQUESTED" == "true" ) ]]; then
            should_run_qualitative=true
          fi

          should_run_integration=false
          if [[ "$GATEWAY_READY" == "true" && "$SANDBOX_READY" == "true" && ( "$INTEGRATION_FILE_CHANGED" == "true" || "$INTEGRATION_REQUESTED" == "true" ) ]]; then
            should_run_integration=true
          fi

          should_run_guardian=false
          if [[ "$GATEWAY_READY" == "true" && ( "$GUARDIAN_FILE_CHANGED" == "true" || "$GUARDIAN_REQUESTED" == "true" ) ]]; then
            should_run_guardian=true
          fi

          echo "should_run_qualitative=$should_run_qualitative" >> "$GITHUB_OUTPUT"
          echo "should_run_integration=$should_run_integration" >> "$GITHUB_OUTPUT"
          echo "should_run_guardian=$should_run_guardian" >> "$GITHUB_OUTPUT"
          {
            echo "## Eval Gate"
            echo
            echo "- qualitative_file_changed: $QUALITATIVE_FILE_CHANGED"
            echo "- qualitative_requested: $QUALITATIVE_REQUESTED"
            echo "- integration_file_changed: $INTEGRATION_FILE_CHANGED"
            echo "- integration_requested: $INTEGRATION_REQUESTED"
            echo "- guardian_file_changed: $GUARDIAN_FILE_CHANGED"
            echo "- guardian_requested: $GUARDIAN_REQUESTED"
            echo "- gateway_ready: $GATEWAY_READY"
            echo "- sandbox_ready: $SANDBOX_READY"
            echo "- will_run_qualitative: $should_run_qualitative"
            echo "- will_run_integration: $should_run_integration"
            echo "- will_run_guardian: $should_run_guardian"
            echo "- qualitative_min_pass_rate: $EVAL_MIN_PASS_RATE"
          } >> "$GITHUB_STEP_SUMMARY"

  guardian:
    # Isolated Guardian snapshots only need the AI Gateway. Exact decision
    # mismatches fail the job hard; no aggregate pass-rate floor.
    name: evals / guardian
    needs: gate
    if: needs.gate.outputs.should_run_guardian == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    env:
      AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
      VERCEL_OIDC_TOKEN: ${{ secrets.VERCEL_OIDC_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-node-pnpm
      - name: Run Guardian evals
        id: run
        env:
          VITEST_EVALS_OUTPUT_FILE: guardian-results.json
          VITEST_EVALS_REPORT_LEVEL: info
        run: pnpm --filter @sentry/junior-evals evals:guardian
      - name: Upload Guardian eval results
        if: always() && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: guardian-evals
          path: packages/junior-evals/guardian-results.json
          if-no-files-found: warn
          retention-days: 7

  integration:
    # Strict system-correctness suite. Any case failure fails the job hard.
    name: evals / integration ${{ matrix.shard }}/2
    needs: gate
    if: needs.gate.outputs.should_run_integration == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: junior
          POSTGRES_PASSWORD: junior
          POSTGRES_DB: junior
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U junior -d junior"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      JUNIOR_EVAL_REDIS_URL: redis://127.0.0.1:6379
      DATABASE_URL: postgres://junior:junior@localhost:5432/junior
      AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_OIDC_TOKEN: ${{ secrets.VERCEL_OIDC_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-node-pnpm
      - name: Install cloudflared
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            https://github.com/cloudflare/cloudflared/releases/download/2026.7.2/cloudflared-linux-amd64 \
            --output "$RUNNER_TEMP/cloudflared"
          echo "ec905ea7b7e327ff8abdde8cb64697a2152de74dbcdbf6aec9db8364eb3886cd  $RUNNER_TEMP/cloudflared" | sha256sum --check
          chmod +x "$RUNNER_TEMP/cloudflared"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/cloudflared" version
      - name: Verify eval egress lifecycle
        run: pnpm --filter @sentry/junior-evals test tests/integration/eval-egress.test.ts
      - name: Run integration evals
        env:
          VITEST_EVALS_OUTPUT_FILE: integration-results-${{ matrix.shard }}.json
          VITEST_EVALS_REPORT_LEVEL: info
        run: pnpm --filter @sentry/junior-evals evals:integration --shard=${{ matrix.shard }}/2
      - name: Upload integration eval results
        if: always() && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: integration-evals-${{ matrix.shard }}
          path: packages/junior-evals/integration-results-${{ matrix.shard }}.json
          if-no-files-found: warn
          retention-days: 7

  qualitative:
    name: evals / qualitative ${{ matrix.shard }}/4
    needs: gate
    if: needs.gate.outputs.should_run_qualitative == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: junior
          POSTGRES_PASSWORD: junior
          POSTGRES_DB: junior
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U junior -d junior"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      JUNIOR_EVAL_REDIS_URL: redis://127.0.0.1:6379
      DATABASE_URL: postgres://junior:junior@localhost:5432/junior
      AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_OIDC_TOKEN: ${{ secrets.VERCEL_OIDC_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-node-pnpm
      - name: Install cloudflared
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            https://github.com/cloudflare/cloudflared/releases/download/2026.7.2/cloudflared-linux-amd64 \
            --output "$RUNNER_TEMP/cloudflared"
          echo "ec905ea7b7e327ff8abdde8cb64697a2152de74dbcdbf6aec9db8364eb3886cd  $RUNNER_TEMP/cloudflared" | sha256sum --check
          chmod +x "$RUNNER_TEMP/cloudflared"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/cloudflared" version
      - name: Verify eval egress lifecycle
        run: pnpm --filter @sentry/junior-evals test tests/integration/eval-egress.test.ts
      - name: Run qualitative evals
        id: run
        continue-on-error: true
        env:
          VITEST_EVALS_OUTPUT_FILE: qualitative-results-${{ matrix.shard }}.json
          VITEST_EVALS_REPORT_LEVEL: info
        run: pnpm --filter @sentry/junior-evals evals:qualitative --shard=${{ matrix.shard }}/4
      - name: Require qualitative eval results
        id: results
        # Run is continue-on-error so case failures still reach this check.
        # Missing results mean setup/runtime crashed and must fail the shard.
        if: steps.run.conclusion != 'skipped'
        run: |
          set -euo pipefail
          result_file="packages/junior-evals/qualitative-results-${{ matrix.shard }}.json"
          if [[ ! -f "$result_file" ]]; then
            echo "::error::missing qualitative eval results for shard ${{ matrix.shard }} ($result_file). Treat setup/runtime crashes as hard failures."
            exit 1
          fi
      - name: Upload qualitative eval results
        if: steps.results.conclusion == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: qualitative-evals-${{ matrix.shard }}
          path: packages/junior-evals/qualitative-results-${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 7

  report:
    # Keep this a boring infra job name. The PR checks list secondary line comes
    # from the separate Checks API run published below (`eval score / qualitative`),
    # not from this workflow job row (those always say "Failing after Xs").
    name: evals / report
    needs: [gate, qualitative]
    if: ${{ always() && !cancelled() && needs.gate.outputs.should_run_qualitative == 'true' }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download qualitative eval results
        uses: actions/download-artifact@v4
        with:
          pattern: qualitative-evals-*
          path: eval-results
          merge-multiple: true

      - name: Require all qualitative shard results
        run: |
          set -euo pipefail
          expected=4
          shopt -s nullglob
          files=(eval-results/qualitative-results-*.json)
          count="${#files[@]}"
          if [[ "$count" -ne "$expected" ]]; then
            echo "::error::expected $expected qualitative eval result files, found $count"
            printf '%s\n' "${files[@]:-}"
            exit 1
          fi
          ls -la eval-results

      - name: Publish combined qualitative eval report
        id: report
        uses: getsentry/vitest-evals@51b8efebcbe9532efc332bf1ff2abbae582bd093 # v0.15.0
        with:
          results: eval-results/*.json
          # Do not use vitest-evals' Check Run: v0.15.0 concludes it from any
          # case failure. We publish our own score-floor Check Run below.
          publish-check: false
          fail-on-failures: false

      - name: Gate qualitative suite on pass rate
        env:
          EVALS_TOTAL: ${{ steps.report.outputs.evals-total }}
          EVALS_FAILED: ${{ steps.report.outputs.evals-failed }}
          SCORE_AVERAGE: ${{ steps.report.outputs.score-average }}
          GITHUB_TOKEN: ${{ github.token }}
          # pull_request GITHUB_SHA is the merge commit; PR status needs head.
          EVAL_CHECK_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          # soft-fail keeps this workflow job green so the PR checks list is not
          # dominated by GitHub's canned job failure text. The published Check
          # Run owns green/red and the custom secondary status line.
          node scripts/check-eval-pass-rate.mjs \
            --total "$EVALS_TOTAL" \
            --failed "$EVALS_FAILED" \
            --min-pass-rate "$EVAL_MIN_PASS_RATE" \
            --score-average "${SCORE_AVERAGE:-n/a}" \
            --publish-check true \
            --soft-fail true \
            --check-name "eval score / qualitative"
