name: Evals

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
    types:
      - opened
      - reopened
      - synchronize
      - labeled

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Combined suite floor for qualitative variability. Individual case failures
# still appear in the report; CI only blocks when the aggregate pass rate dips
# below this value. Infrastructure/setup failures remain hard failures.
env:
  EVAL_MIN_PASS_RATE: "0.8"

jobs:
  gate:
    name: evals / gate
    runs-on: blacksmith-4vcpu-ubuntu-2404
    outputs:
      eval_file_changed: ${{ steps.changes.outputs.eval_file_changed }}
      evals_requested: ${{ steps.request.outputs.evals_requested }}
      gateway_ready: ${{ steps.secrets.outputs.gateway_ready }}
      sandbox_ready: ${{ steps.secrets.outputs.sandbox_ready }}
      should_run: ${{ steps.decision.outputs.should_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: request
        run: |
          set -euo pipefail

          action="$(jq -r '.action // ""' "$GITHUB_EVENT_PATH")"
          requested=false
          if [[ "$action" == "labeled" ]]; then
            if [[ "$(jq -r '.label.name // ""' "$GITHUB_EVENT_PATH")" == "trigger-evals" ]]; then
              requested=true
            fi
          elif jq -e '.pull_request.labels[]?.name | select(. == "trigger-evals")' "$GITHUB_EVENT_PATH" >/dev/null; then
            requested=true
          fi

          echo "evals_requested=$requested" >> "$GITHUB_OUTPUT"

      - uses: getsentry/action-filter-paths@98a158469c63115591d1c2952d34450838ab3bc1 # v0.1.0
        id: changes
        with:
          filters: |
            eval_file_changed:
              - '**/*.eval.ts'

      - id: secrets
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          VERCEL_OIDC_TOKEN: ${{ secrets.VERCEL_OIDC_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail

          if [[ -n "${AI_GATEWAY_API_KEY:-}" || -n "${VERCEL_OIDC_TOKEN:-}" ]]; then
            echo "gateway_ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "gateway_ready=false" >> "$GITHUB_OUTPUT"
          fi

          if [[ -n "${VERCEL_OIDC_TOKEN:-}" || ( -n "${VERCEL_TOKEN:-}" && -n "${VERCEL_TEAM_ID:-}" && -n "${VERCEL_PROJECT_ID:-}" ) ]]; then
            echo "sandbox_ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "sandbox_ready=false" >> "$GITHUB_OUTPUT"
          fi

      - id: decision
        env:
          EVAL_FILE_CHANGED: ${{ steps.changes.outputs.eval_file_changed }}
          EVALS_REQUESTED: ${{ steps.request.outputs.evals_requested }}
          GATEWAY_READY: ${{ steps.secrets.outputs.gateway_ready }}
          SANDBOX_READY: ${{ steps.secrets.outputs.sandbox_ready }}
        run: |
          set -euo pipefail

          should_run=false
          if [[ "$GATEWAY_READY" == "true" && "$SANDBOX_READY" == "true" && ( "$EVAL_FILE_CHANGED" == "true" || "$EVALS_REQUESTED" == "true" ) ]]; then
            should_run=true
          fi

          echo "should_run=$should_run" >> "$GITHUB_OUTPUT"
          {
            echo "## Eval Gate"
            echo
            echo "- eval_file_changed: $EVAL_FILE_CHANGED"
            echo "- evals_requested: $EVALS_REQUESTED"
            echo "- gateway_ready: $GATEWAY_READY"
            echo "- sandbox_ready: $SANDBOX_READY"
            echo "- will_run: $should_run"
            echo "- min_pass_rate: $EVAL_MIN_PASS_RATE"
          } >> "$GITHUB_STEP_SUMMARY"

  evals:
    name: evals / suite ${{ matrix.shard }}/4
    needs: gate
    if: needs.gate.outputs.should_run == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: junior
          POSTGRES_PASSWORD: junior
          POSTGRES_DB: junior
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U junior -d junior"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      JUNIOR_EVAL_REDIS_URL: redis://127.0.0.1:6379
      DATABASE_URL: postgres://junior:junior@localhost:5432/junior
      AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_OIDC_TOKEN: ${{ secrets.VERCEL_OIDC_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-node-pnpm
      - name: Install cloudflared
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            https://github.com/cloudflare/cloudflared/releases/download/2026.7.2/cloudflared-linux-amd64 \
            --output "$RUNNER_TEMP/cloudflared"
          echo "ec905ea7b7e327ff8abdde8cb64697a2152de74dbcdbf6aec9db8364eb3886cd  $RUNNER_TEMP/cloudflared" | sha256sum --check
          chmod +x "$RUNNER_TEMP/cloudflared"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/cloudflared" version
      - name: Verify eval egress lifecycle
        run: pnpm --filter @sentry/junior-evals test tests/integration/eval-egress.test.ts
      - name: Run evals
        id: run
        continue-on-error: true
        env:
          VITEST_EVALS_OUTPUT_FILE: vitest-results-${{ matrix.shard }}.json
          VITEST_EVALS_REPORT_LEVEL: info
        run: pnpm --filter @sentry/junior-evals evals --shard=${{ matrix.shard }}/4
      - name: Require eval results
        id: results
        # Run is continue-on-error so case failures still reach this check.
        # Missing results mean setup/runtime crashed and must fail the shard.
        if: steps.run.conclusion != 'skipped'
        run: |
          set -euo pipefail
          result_file="packages/junior-evals/vitest-results-${{ matrix.shard }}.json"
          if [[ ! -f "$result_file" ]]; then
            echo "::error::missing eval results for shard ${{ matrix.shard }} ($result_file). Treat setup/runtime crashes as hard failures."
            exit 1
          fi
      - name: Upload eval results
        if: steps.results.conclusion == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: vitest-evals-${{ matrix.shard }}
          path: packages/junior-evals/vitest-results-${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 7

  report:
    # Keep this a boring infra job name. The PR checks list secondary line comes
    # from the separate Checks API run published below (`eval score`), not from
    # this workflow job row (those always say "Failing after Xs").
    name: evals / report
    needs: [gate, evals]
    if: ${{ always() && !cancelled() && needs.gate.outputs.should_run == 'true' }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download eval results
        uses: actions/download-artifact@v4
        with:
          pattern: vitest-evals-*
          path: eval-results
          merge-multiple: true

      - name: Require all shard results
        run: |
          set -euo pipefail
          expected=4
          shopt -s nullglob
          files=(eval-results/vitest-results-*.json)
          count="${#files[@]}"
          if [[ "$count" -ne "$expected" ]]; then
            echo "::error::expected $expected eval result files, found $count"
            printf '%s\n' "${files[@]:-}"
            exit 1
          fi
          ls -la eval-results

      - name: Publish combined eval report
        uses: getsentry/vitest-evals@542bab9411e1638c14f177c1884d5334089dcdd4 # v0.16.0
        with:
          results: eval-results/*.json
          publish-check: true
          check-name: eval score
          min-pass-rate: ${{ env.EVAL_MIN_PASS_RATE }}
