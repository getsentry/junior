name: TEMP direct reminder probe

permissions:
  contents: read

on:
  pull_request:
    branches: [main]

concurrency:
  group: zz-probe-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  probe:
    name: probe ${{ matrix.shard }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: junior
          POSTGRES_PASSWORD: junior
          POSTGRES_DB: junior
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U junior -d junior"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      JUNIOR_EVAL_REDIS_URL: redis://127.0.0.1:6379
      DATABASE_URL: postgres://junior:junior@localhost:5432/junior
      AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_OIDC_TOKEN: ${{ secrets.VERCEL_OIDC_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-pnpm
      # Evals load the built output of some workspace packages.
      - run: pnpm --filter "@sentry/junior-evals^..." run build
      - name: Install cloudflared
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            --retry 3 --retry-max-time 120 --connect-timeout 10 --max-time 60 \
            https://github.com/cloudflare/cloudflared/releases/download/2026.10.4/cloudflared-linux-amd64 \
            --output "$RUNNER_TEMP/cloudflared"
          echo "ae5e8add7884b0531d66bbca4570d1de491ff6da51e4ebe7eb160cdf241d9e42  $RUNNER_TEMP/cloudflared" | sha256sum --check
          chmod +x "$RUNNER_TEMP/cloudflared"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/cloudflared" version
      # The evals build a sandbox snapshot only when this file does not have it.
      - name: Keep sandbox snapshot ids
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/junior-evals/sandbox-snapshots.json
          key: eval-sandbox-snapshots-${{ github.run_id }}
          restore-keys: eval-sandbox-snapshots-
      - name: Run probe
        env:
          VITEST_EVALS_OUTPUT_FILE: probe-results-${{ matrix.shard }}.json
          VITEST_EVALS_REPORT_LEVEL: info
          ROACH_MODE: "off"
          PROBE_REPS: "30"
        run: pnpm --filter @sentry/junior-evals evals:integration evals/integration/scheduler/zz-probe-direct-reminder.eval.ts
      - name: Upload probe results
        if: always() && !cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: probe-${{ matrix.shard }}
          path: packages/junior-evals/probe-results-${{ matrix.shard }}.json
          if-no-files-found: warn
          retention-days: 7
