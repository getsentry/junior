name: Dashboard Visual

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths:
      - "packages/junior-dashboard/**"
      - ".github/workflows/dashboard-visual.yml"
      - "package.json"
      - "pnpm-lock.yaml"

concurrency:
  group: dashboard-visual-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  capture:
    name: visual / capture
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    # Same-repo pull_request only. Capture stays read-only and never receives a
    # write token. Commenting runs in dashboard-visual-comment.yml on the
    # default branch via workflow_run.
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve run mode
        id: mode
        env:
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          if [[ ",$PR_LABELS," == *",trigger-visual,"* ]]; then
            echo "all=true" >> "$GITHUB_OUTPUT"
          else
            echo "all=false" >> "$GITHUB_OUTPUT"
          fi

          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > /tmp/visual-changed.txt
          cat /tmp/visual-changed.txt

          if [[ -s /tmp/visual-changed.txt ]] && grep -q '^packages/junior-dashboard/' /tmp/visual-changed.txt; then
            has_dashboard=true
          else
            has_dashboard=false
          fi

          if [[ ",$PR_LABELS," == *",trigger-visual,"* || "$has_dashboard" == "true" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      # No shared Actions cache. Capture runs PR head code; writing the default
      # pnpm cache from that tree is a cache-poisoning path.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        if: steps.mode.outputs.run == 'true'
        with:
          run_install: false

      - uses: actions/setup-node@v4
        if: steps.mode.outputs.run == 'true'
        with:
          node-version: "24.18.0"

      - name: Install dependencies
        if: steps.mode.outputs.run == 'true'
        run: pnpm install --frozen-lockfile

      - run: pnpm exec playwright install --with-deps chromium
        if: steps.mode.outputs.run == 'true'

      - name: Capture screenshots
        if: steps.mode.outputs.run == 'true'
        env:
          ALL: ${{ steps.mode.outputs.all }}
          PR_NUMBER: ${{ steps.mode.outputs.pr_number }}
        run: |
          set -euo pipefail
          out_dir=.playwright/visual-dashboard
          args=(--changed-file /tmp/visual-changed.txt --out-dir "$out_dir")
          if [[ "$ALL" == "true" ]]; then
            args+=(--all)
          fi
          pnpm run visual:dashboard -- "${args[@]}"
          printf '%s\n' "$PR_NUMBER" > "$out_dir/pr-number.txt"

      - name: Upload visual artifacts
        if: steps.mode.outputs.run == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-visual
          path: .playwright/visual-dashboard
          if-no-files-found: warn
          retention-days: 14
