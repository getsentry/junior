name: Dashboard Visual

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths:
      - "packages/junior-dashboard/**"
      - ".github/workflows/dashboard-visual.yml"
      - "package.json"
      - "pnpm-lock.yaml"

concurrency:
  group: dashboard-visual-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  capture:
    name: visual / capture
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    # Same-repo pull_request only. Do not add workflow_dispatch that checks out
    # PR head from default-branch context (CodeQL cache-poisoning rule).
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: read
    outputs:
      all: ${{ steps.mode.outputs.all }}
      pr_number: ${{ steps.mode.outputs.pr_number }}
      run: ${{ steps.mode.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve run mode
        id: mode
        env:
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          if [[ ",$PR_LABELS," == *",trigger-visual,"* ]]; then
            echo "all=true" >> "$GITHUB_OUTPUT"
          else
            echo "all=false" >> "$GITHUB_OUTPUT"
          fi

          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > /tmp/visual-changed.txt
          cat /tmp/visual-changed.txt

          if [[ -s /tmp/visual-changed.txt ]] && grep -q '^packages/junior-dashboard/' /tmp/visual-changed.txt; then
            has_dashboard=true
          else
            has_dashboard=false
          fi

          if [[ ",$PR_LABELS," == *",trigger-visual,"* || "$has_dashboard" == "true" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      # No shared Actions cache. Capture runs PR head code; writing the default
      # pnpm cache from that tree is a cache-poisoning path.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        if: steps.mode.outputs.run == 'true'
        with:
          run_install: false

      - uses: actions/setup-node@v4
        if: steps.mode.outputs.run == 'true'
        with:
          node-version: "24.18.0"

      - name: Install dependencies
        if: steps.mode.outputs.run == 'true'
        run: pnpm install --frozen-lockfile

      - run: pnpm exec playwright install --with-deps chromium
        if: steps.mode.outputs.run == 'true'

      - name: Capture screenshots
        if: steps.mode.outputs.run == 'true'
        env:
          ALL: ${{ steps.mode.outputs.all }}
        run: |
          set -euo pipefail
          args=(--changed-file /tmp/visual-changed.txt --out-dir .playwright/visual-dashboard)
          if [[ "$ALL" == "true" ]]; then
            args+=(--all)
          fi
          pnpm run visual:dashboard -- "${args[@]}"

      - name: Upload visual artifacts
        if: steps.mode.outputs.run == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-visual-${{ steps.mode.outputs.pr_number }}
          path: .playwright/visual-dashboard
          if-no-files-found: warn
          retention-days: 14

  comment:
    name: visual / comment
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    needs: capture
    if: >-
      always() &&
      !cancelled() &&
      needs.capture.result == 'success' &&
      needs.capture.outputs.run == 'true'
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Write-scoped job never installs packages and never checks out the full PR
      # tree. Prefer the publisher on the default branch; bootstrap from the PR
      # only while the script is still landing.
      - name: Load trusted publisher
        id: publisher
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: |
            packages/junior-dashboard/visual/post-pr-comment.mjs
          sparse-checkout-cone-mode: false

      - name: Bootstrap publisher from PR head
        if: hashFiles('packages/junior-dashboard/visual/post-pr-comment.mjs') == ''
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            packages/junior-dashboard/visual/post-pr-comment.mjs
          sparse-checkout-cone-mode: false

      - name: Download visual artifacts
        uses: actions/download-artifact@v4
        with:
          name: dashboard-visual-${{ needs.capture.outputs.pr_number }}
          path: .playwright/visual-dashboard

      - name: Comment screenshots on PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ needs.capture.outputs.pr_number }}
        run: node packages/junior-dashboard/visual/post-pr-comment.mjs .playwright/visual-dashboard
