name: Dashboard Visual

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths:
      - "packages/junior-dashboard/**"
      - ".github/workflows/dashboard-visual.yml"
      - "package.json"
      - "pnpm-lock.yaml"
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to comment on
        required: true
        type: string
      all:
        description: Capture every registered scenario
        required: false
        default: true
        type: boolean

concurrency:
  group: dashboard-visual-${{ github.event.pull_request.number || inputs.pr_number || github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    name: visual / capture
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository
      )
    permissions:
      contents: read
      pull-requests: read
    outputs:
      all: ${{ steps.mode.outputs.all }}
      pr_number: ${{ steps.mode.outputs.pr_number }}
      run: ${{ steps.mode.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/pull/{0}/head', inputs.pr_number) || github.sha }}

      - name: Resolve run mode
        id: mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          FORCE_ALL_INPUT: ${{ inputs.all }}
          GH_TOKEN: ${{ github.token }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          PR_NUMBER_INPUT: ${{ inputs.pr_number }}
          PR_NUMBER_EVENT: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "pr_number=$PR_NUMBER_INPUT" >> "$GITHUB_OUTPUT"
            head_repo="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER_INPUT}" --jq .head.repo.full_name)"
            if [[ "$head_repo" != "$REPOSITORY" ]]; then
              echo "Refusing workflow_dispatch for fork PR head ($head_repo)."
              echo "all=false" >> "$GITHUB_OUTPUT"
              echo "run=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [[ "$FORCE_ALL_INPUT" == "true" ]]; then
              echo "all=true" >> "$GITHUB_OUTPUT"
            else
              echo "all=false" >> "$GITHUB_OUTPUT"
            fi
            : > /tmp/visual-changed.txt
          else
            echo "pr_number=$PR_NUMBER_EVENT" >> "$GITHUB_OUTPUT"
            if [[ ",$PR_LABELS," == *",trigger-visual,"* ]]; then
              echo "all=true" >> "$GITHUB_OUTPUT"
            else
              echo "all=false" >> "$GITHUB_OUTPUT"
            fi
            git diff --name-only "$BASE_SHA" "$HEAD_SHA" > /tmp/visual-changed.txt
          fi

          cat /tmp/visual-changed.txt

          if [[ -s /tmp/visual-changed.txt ]] && grep -q '^packages/junior-dashboard/' /tmp/visual-changed.txt; then
            has_dashboard=true
          else
            has_dashboard=false
          fi

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$FORCE_ALL_INPUT" == "true" || "$has_dashboard" == "true" ]]; then
              echo "run=true" >> "$GITHUB_OUTPUT"
            else
              echo "run=false" >> "$GITHUB_OUTPUT"
            fi
          else
            if [[ ",$PR_LABELS," == *",trigger-visual,"* || "$has_dashboard" == "true" ]]; then
              echo "run=true" >> "$GITHUB_OUTPUT"
            else
              echo "run=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      # No shared Actions cache here. Capture runs PR head code, and writing the
      # default pnpm cache from untrusted code is a cache-poisoning path.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        if: steps.mode.outputs.run == 'true'
        with:
          run_install: false

      - uses: actions/setup-node@v4
        if: steps.mode.outputs.run == 'true'
        with:
          node-version: "24.18.0"

      - name: Install dependencies
        if: steps.mode.outputs.run == 'true'
        run: pnpm install --frozen-lockfile

      - run: pnpm exec playwright install --with-deps chromium
        if: steps.mode.outputs.run == 'true'

      - name: Capture screenshots
        if: steps.mode.outputs.run == 'true'
        env:
          ALL: ${{ steps.mode.outputs.all }}
        run: |
          set -euo pipefail
          args=(--changed-file /tmp/visual-changed.txt --out-dir .playwright/visual-dashboard)
          if [[ "$ALL" == "true" ]]; then
            args+=(--all)
          fi
          pnpm run visual:dashboard -- "${args[@]}"

      - name: Upload visual artifacts
        if: steps.mode.outputs.run == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-visual-${{ steps.mode.outputs.pr_number }}
          path: .playwright/visual-dashboard
          if-no-files-found: warn
          retention-days: 14

  comment:
    name: visual / comment
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    needs: capture
    if: >-
      always() &&
      !cancelled() &&
      needs.capture.result == 'success' &&
      needs.capture.outputs.run == 'true'
    permissions:
      contents: write
      pull-requests: write
    steps:
      # No package install here. Prefer the publisher from the default branch when
      # present so a PR cannot replace the write-scoped comment script after the
      # feature lands on main. Fall back to the PR copy only while bootstrapping.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/pull/{0}/head', inputs.pr_number) || github.sha }}

      - name: Prefer trusted publisher from default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "$DEFAULT_BRANCH"
          if git cat-file -e "origin/${DEFAULT_BRANCH}:packages/junior-dashboard/visual/post-pr-comment.mjs"; then
            git checkout "origin/${DEFAULT_BRANCH}" -- packages/junior-dashboard/visual/post-pr-comment.mjs
            echo "Using publisher from origin/${DEFAULT_BRANCH}"
          else
            echo "Publisher not on origin/${DEFAULT_BRANCH} yet; using PR copy for bootstrap"
          fi

      - name: Download visual artifacts
        uses: actions/download-artifact@v4
        with:
          name: dashboard-visual-${{ needs.capture.outputs.pr_number }}
          path: .playwright/visual-dashboard

      - name: Comment screenshots on PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ needs.capture.outputs.pr_number }}
        run: node packages/junior-dashboard/visual/post-pr-comment.mjs .playwright/visual-dashboard
