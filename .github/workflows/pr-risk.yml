name: PR Risk Experiment

on:
  # Needs a write token on fork PRs to apply the risk label. No step checks
  # out or runs PR code; the action reads the PR through the API.
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: pr-risk-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  risk:
    name: Score PR risk
    runs-on: blacksmith-4vcpu-ubuntu-2404
    if: github.event.pull_request.draft == false

    steps:
      - name: Score current PR
        uses: getsentry/pr-risk-action@f5126d7a979415ac5124b7c14919482b149382aa # v0
        with:
          repo: ${{ github.repository }}
          pr-number: ${{ github.event.pull_request.number }}
          result-path: risk-pr-result.json
          skip-reviews: "true"
          apply-label: "true"

      - name: Upload risk result
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: risk-pr-result
          path: risk-pr-result.json
