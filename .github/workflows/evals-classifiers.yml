name: Evals

permissions:
  contents: read
  pull-requests: read
  actions: read

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, labeled]

concurrency:
  group: evals-classifiers-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  select:
    name: classifiers / select
    runs-on: blacksmith-4vcpu-ubuntu-2404
    outputs:
      should_run: ${{ steps.decision.outputs.should_run }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: getsentry/action-filter-paths@98a158469c63115591d1c2952d34450838ab3bc1 # v0.1.0
        id: changes
        with:
          filters: |
            relevant:
              - 'packages/junior-evals/roach.json'
              - 'packages/junior-evals/src/fetch-setup.ts'
              - 'packages/junior-evals/src/proxy-dispatcher.ts'
              - 'packages/junior-evals/evals/classifiers/**'
              - 'packages/junior-evals/src/review-item-reply-harness.ts'
              - 'packages/junior-evals/src/pr-description-check-harness.ts'
              - 'packages/junior-evals/src/eval-ai-gateway-dispatcher.ts'
              - 'packages/junior-evals/vitest.evals.classifiers.config.ts'
              - 'packages/junior-evals/package.json'
              - 'packages/junior-evals/scripts/report.mjs'
              - 'packages/junior-evals/scripts/network-jail.sh'
              - 'packages/junior/src/chat/pi/client.ts'
              - 'packages/junior/src/chat/review-items/reply-match.ts'
              - 'packages/junior-github/src/tool-support/pull-request-description.ts'
      - id: decision
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          VERCEL_OIDC_TOKEN: ${{ secrets.VERCEL_OIDC_TOKEN }}
          RELEVANT: ${{ steps.changes.outputs.relevant }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          set -euo pipefail
          gateway_ready=false
          requested=false
          [[ -n "${AI_GATEWAY_API_KEY:-}" || -n "${VERCEL_OIDC_TOKEN:-}" ]] && gateway_ready=true
          IFS=',' read -r -a labels <<< "${PR_LABELS:-}"
          for label in "${labels[@]}"; do
            if [[ "$label" == "trigger-evals" || "$label" == "trigger-evals-classifiers" ]]; then
              requested=true
            fi
          done
          should_run=false
          [[ "$gateway_ready" == "true" && ( "$RELEVANT" == "true" || "$requested" == "true" ) ]] && should_run=true
          echo "should_run=$should_run" >> "$GITHUB_OUTPUT"
          {
            echo "## Classifier eval selection"
            echo
            echo "- relevant_files_changed: $RELEVANT"
            echo "- requested: $requested"
            echo "- gateway_ready: $gateway_ready"
            echo "- will_run: $should_run"
          } >> "$GITHUB_STEP_SUMMARY"

  classifiers:
    name: classifiers / run
    needs: select
    if: needs.select.outputs.should_run == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
      pull-requests: read
      actions: read
      checks: write
    env:
      AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
      VERCEL_OIDC_TOKEN: ${{ secrets.VERCEL_OIDC_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-pnpm
      # Evals load the built output of some workspace packages.
      - run: pnpm --filter "@sentry/junior-evals^..." run build
      - name: Run classifier evals
        id: run
        continue-on-error: true
        env:
          VITEST_EVALS_OUTPUT_FILE: classifiers-results.json
          VITEST_EVALS_REPORT_LEVEL: info
          # The write token of Roach. With it, the run records new requests.
          ROACH_TOKEN: ${{ secrets.ROACH_TOKEN }}
        run: packages/junior-evals/scripts/network-jail.sh pnpm --filter @sentry/junior-evals evals:classifiers
      - name: Require classifier eval results
        id: results
        if: steps.run.conclusion != 'skipped'
        run: |
          set -euo pipefail
          result_file="packages/junior-evals/classifiers-results.json"
          if [[ ! -f "$result_file" ]]; then
            echo "::error::missing classifier eval results ($result_file). Treat setup/runtime crashes as hard failures."
            exit 1
          fi
      - name: Publish classifier eval summary
        if: steps.results.conclusion == 'success'
        uses: getsentry/vitest-evals@abea6a519955e5df56ecb2a2d83bae9c821561e1 # v0.16.1
        with:
          results: packages/junior-evals/classifiers-results.json
          publish-check: true
          check-name: classifiers / score
          fail-on-failures: true
      - name: Upload classifier eval results
        if: steps.results.conclusion == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: classifiers-evals
          path: packages/junior-evals/classifiers-results.json
          if-no-files-found: error
          retention-days: 7
      - name: Report evals to Sentry Evals
        if: ${{ !cancelled() && steps.results.outcome == 'success' }}
        env:
          SENTRY_EVALS_API_KEY: ${{ secrets.SENTRY_EVALS_API_KEY }}
        run: node packages/junior-evals/scripts/report.mjs classifiers packages/junior-evals/classifiers-results.json
