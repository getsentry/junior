name: CI

permissions:
  contents: read

on:
  push:
    branches:
      - main
      - release/**
      - releases/**
      - release-*
      - auto-release/**
      # Integration branch for the rewritten core agent loop.
      - core-next
  pull_request:
    branches: [main, core-next]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    name: changes / detect
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
    outputs:
      ci: ${{ steps.filter.outputs.ci }}
      core: ${{ steps.filter.outputs.core }}
      dashboard: ${{ steps.filter.outputs.dashboard }}
      docs: ${{ steps.filter.outputs.docs }}
      evals: ${{ steps.filter.outputs.evals }}
      example: ${{ steps.filter.outputs.example }}
      ios: ${{ steps.filter.outputs.ios }}
      ios_app: ${{ steps.filter.outputs.ios_app }}
      full: ${{ steps.filter.outputs.repo == 'true' || steps.filter.outputs.changes == '[]' }}
      plugins: ${{ steps.filter.outputs.plugins }}
      release: ${{ steps.filter.outputs.release }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: getsentry/action-filter-paths@98a158469c63115591d1c2952d34450838ab3bc1 # v0.1.0
        id: filter
        with:
          filters: |
            ci:
              - .github/workflows/**
              - .github/actions/**
              - "!.github/workflows/ios.yml"
              - "!.github/workflows/ios-beta.yml"
              - "!.github/workflows/ios-beta-label.yml"
            core:
              - packages/junior/**
              - packages/junior-plugin-api/**
              - packages/junior-testing/**
              - policies/**
            dashboard:
              - packages/junior-dashboard/**
              - packages/junior/**
              - packages/junior-plugin-api/**
            docs:
              - packages/docs/**
              - README.md
              - policies/**
            evals:
              - packages/junior-evals/**
            example:
              - apps/example/**
              - packages/junior/**
              - packages/junior-plugin-api/**
            ios:
              - apps/ios/**
              - .github/workflows/ios.yml
            # The iOS UI tests and screenshots take about 25 minutes, so they
            # skip when only the iOS workflow changes.
            ios_app:
              - apps/ios/**
            # Only lint reads these. Listing them keeps a change to them from
            # counting as unknown, which runs every job.
            lint_config:
              - ast-grep/**
              - sgconfig.yml
            plugins:
              - packages/junior-agent-browser/**
              - packages/junior-amplitude/**
              - packages/junior-cloudflare/**
              - packages/junior-datadog/**
              - packages/junior-figma/**
              - packages/junior-tts/**
              - packages/junior-github/**
              - packages/junior-google/**
              - packages/junior-hex/**
              - packages/junior-linear/**
              - packages/junior-maintenance/**
              - packages/junior-notion/**
              - packages/junior-octolens/**
              - packages/junior-pagerduty/**
              - packages/junior-restream/**
              - packages/junior-sentry/**
              - packages/junior-vercel/**
              - packages/junior-vimeo/**
              - packages/junior-xdotcom/**
            repo:
              - package.json
              - pnpm-lock.yaml
              - pnpm-workspace.yaml
              - tsconfig*.json
              - packages/*/package.json
              - apps/*/package.json
              - .oxlintrc.json
              - .oxfmtrc.json
              - scripts/**
              - tools/**
            release:
              - .craft.yml
              - .github/workflows/ci.yml
              - .github/workflows/release.yml
              - CONTRIBUTING.md
              - README.md
              - scripts/bump-release-versions.mjs
              - scripts/check-release-config.mjs
              - scripts/check.mjs
              - scripts/lib/repo-files.mjs
              - scripts/release-artifacts*.mjs
              - scripts/publish-github-release*.mjs
              - packages/*/package.json
              - packages/docs/**
            workflows:
              - .github/workflows/**
              - .github/actions/**

  release-check:
    name: check / release config
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.ci == 'true' || needs.changes.outputs.release == 'true' || needs.changes.outputs.full == 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-pnpm
      - run: pnpm release:check

  skills-check:
    name: check / skills
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.ci == 'true' || needs.changes.outputs.core == 'true' || needs.changes.outputs.plugins == 'true' || needs.changes.outputs.full == 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-pnpm
      - run: pnpm skills:check

  lint:
    name: lint / workspace
    runs-on: blacksmith-4vcpu-ubuntu-2404
    # Lint covers every file in the repo, so no path filter can skip it.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # baseline-growth:check compares baselines to the merge base with origin/main.
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-node-pnpm
      # Type-aware lint reads the declarations that workspace packages build.
      - run: pnpm build
      - run: pnpm lint

  format:
    name: check / format
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-pnpm
      - run: pnpm format:check

  typecheck:
    name: check / types
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.ci == 'true' || needs.changes.outputs.core == 'true' || needs.changes.outputs.dashboard == 'true' || needs.changes.outputs.docs == 'true' || needs.changes.outputs.evals == 'true' || needs.changes.outputs.example == 'true' || needs.changes.outputs.plugins == 'true' || needs.changes.outputs.full == 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-pnpm
      # Packages check against the declarations that their dependencies build.
      - run: pnpm build
      - run: pnpm typecheck

  eval-report-tests:
    name: test / eval reporting
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.ci == 'true' || needs.changes.outputs.evals == 'true' || needs.changes.outputs.full == 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # setup-node v4 caches only when `cache` is set, and this step sets none.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0 # zizmor: ignore[cache-poisoning]
        with:
          node-version: "24.22.1"
      - run: node --test packages/junior-evals/scripts/report.test.mjs

  junior-tests:
    name: test / junior ${{ matrix.suite }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.ci == 'true' || needs.changes.outputs.core == 'true' || needs.changes.outputs.plugins == 'true' || needs.changes.outputs.full == 'true'
    permissions:
      actions: read
      contents: read
      pull-requests: read
      statuses: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: unit
            path: tests/unit
            max_workers: 4
            test_timeout: 5000
          - suite: component
            path: tests/component
            max_workers: 4
            test_timeout: 5000
          - suite: integration
            path: tests/integration
            max_workers: 2
            test_timeout: 20000
    env:
      DATABASE_URL: postgres://junior:junior@localhost:5432/junior
      REDIS_URL: redis://localhost:6379
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: junior
          POSTGRES_PASSWORD: junior
          POSTGRES_USER: junior
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U junior -d junior"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # Keep in sync with the s3 service in compose.yaml.
      s3:
        image: versity/versitygw:v1.10.0
        env:
          ROOT_ACCESS_KEY: junior
          ROOT_SECRET_KEY: junior-secret
          VGW_BACKEND: posix
          VGW_BACKEND_ARG: /tmp
          VGW_HEALTH: /health
        ports:
          - 7072:7070
        options: >-
          --health-cmd "wget -qO- http://localhost:7070/health"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-pnpm
      # The example build tests load every plugin that the example app uses.
      - run: pnpm --filter "@sentry/junior-example^..." run build
      - run: pnpm --filter @sentry/junior exec vitest run --maxWorkers=${{ matrix.max_workers }} --testTimeout=${{ matrix.test_timeout }} --coverage ${{ matrix.path }}
      - name: Upload coverage
        if: ${{ !cancelled() }}
        uses: getsentry/codecov-action@eb2b4a6c4be3ecb42867043570579fa3b6879f6e # 0.3.8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: packages/junior/coverage/coverage-final.json
          coverage-format: istanbul
          disable-search: true
          enable-tests: false
          fail-ci-if-error: false
          informational-project: true
          informational-patch: true

  eval-harness-tests:
    name: test / eval harness
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.ci == 'true' || needs.changes.outputs.core == 'true' || needs.changes.outputs.plugins == 'true' || needs.changes.outputs.evals == 'true' || needs.changes.outputs.full == 'true'
    timeout-minutes: 10
    env:
      DATABASE_URL: postgres://junior:junior@localhost:5432/junior
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: junior
          POSTGRES_PASSWORD: junior
          POSTGRES_USER: junior
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U junior -d junior"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-pnpm
      - run: pnpm --filter "@sentry/junior-evals^..." run build
      - run: pnpm --filter @sentry/junior-evals test

  workspace-snapshot-lifecycle:
    name: test / Workspace snapshot lifecycle
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: changes
    timeout-minutes: 15
    if: github.event_name == 'push' || needs.changes.outputs.ci == 'true' || needs.changes.outputs.core == 'true' || needs.changes.outputs.plugins == 'true' || needs.changes.outputs.full == 'true'
    permissions:
      contents: read
    env:
      DATABASE_URL: postgres://junior:junior@localhost:5432/junior
      REDIS_URL: redis://localhost:6379
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: junior
          POSTGRES_PASSWORD: junior
          POSTGRES_USER: junior
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U junior -d junior"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-pnpm
      - run: pnpm --filter "@sentry/junior..." run build
      - run: pnpm --filter @sentry/junior exec vitest run tests/integration/workspace-snapshot-lifecycle.test.ts tests/integration/sandbox-egress-trace-headers.test.ts

  plugin-tests:
    name: test / plugins
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.ci == 'true' || needs.changes.outputs.core == 'true' || needs.changes.outputs.plugins == 'true' || needs.changes.outputs.full == 'true'
    env:
      DATABASE_URL: postgres://junior:junior@localhost:5432/junior
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: junior
          POSTGRES_PASSWORD: junior
          POSTGRES_USER: junior
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U junior -d junior"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-pnpm
      # Every plugin package with a test script runs, so a new one cannot be
      # left out.
      - run: pnpm --filter "./packages/junior-*" --filter "!@sentry/junior-dashboard" --filter "!@sentry/junior-evals" run build
      - run: pnpm -r --workspace-concurrency=1 --filter "./packages/junior-*" --filter "!@sentry/junior-dashboard" --filter "!@sentry/junior-evals" run test

  dashboard-tests:
    name: test / dashboard
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.ci == 'true' || needs.changes.outputs.dashboard == 'true' || needs.changes.outputs.full == 'true'
    permissions:
      actions: read
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # dashboard-bundle-size:check reads the baseline at the merge base
          # with origin/main.
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-node-pnpm
      - run: pnpm --filter "@sentry/junior-dashboard..." run build
      # Reads the client build above, so it does not build again.
      - run: pnpm dashboard-bundle-size:check
      - run: pnpm --filter @sentry/junior-dashboard test:coverage
      - name: Upload coverage and test results
        if: ${{ !cancelled() }}
        uses: getsentry/codecov-action@eb2b4a6c4be3ecb42867043570579fa3b6879f6e # 0.3.8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: packages/junior-dashboard/coverage/coverage-final.json
          coverage-format: istanbul
          disable-search: true
          junit-xml-pattern: packages/junior-dashboard/coverage/results.junit.xml
          fail-ci-if-error: false
          informational-project: true
          informational-patch: true

  dashboard-e2e:
    name: test / dashboard e2e (${{ matrix.project }} ${{ matrix.shard }}/2)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: changes
    permissions:
      contents: read
    # Two shards per Playwright project, so each job stays under the cap.
    strategy:
      fail-fast: false
      matrix:
        project: [classic, inbox]
        shard: [1, 2]
    # Keep a hard cap so install/test hangs fail fast.
    timeout-minutes: 15
    if: github.event_name == 'push' || needs.changes.outputs.ci == 'true' || needs.changes.outputs.dashboard == 'true' || needs.changes.outputs.full == 'true'
    env:
      DATABASE_URL: postgres://junior:junior@localhost:5432/junior
      REDIS_URL: redis://localhost:6379
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: junior
          POSTGRES_PASSWORD: junior
          POSTGRES_USER: junior
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U junior -d junior"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-pnpm
      - name: Run dashboard e2e
        env:
          PLAYWRIGHT_PROJECT: ${{ matrix.project }}
          PLAYWRIGHT_SHARD: ${{ matrix.shard }}
        run: pnpm test:e2e:dashboard --project="$PLAYWRIGHT_PROJECT" --shard="$PLAYWRIGHT_SHARD/2"
      - name: Upload dashboard screenshots
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dashboard-screenshots-${{ matrix.project }}-${{ matrix.shard }}
          path: .playwright/junior-dashboard/screenshots
          if-no-files-found: error
          retention-days: 7
      # Playwright keeps a trace only for a failed attempt. Upload it also
      # when the retry passed, so a flaky test leaves a trace.
      - name: Upload failed test traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dashboard-e2e-traces-${{ matrix.project }}-${{ matrix.shard }}
          path: .playwright/junior-dashboard/*/trace.zip
          if-no-files-found: ignore
          retention-days: 7

  # Frameshift saves or compares one screenshot set per run, so it runs once,
  # on the screenshots of every e2e job.
  dashboard-screenshots:
    name: test / dashboard screenshots
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: dashboard-e2e
    permissions:
      actions: read
      contents: read
    outputs:
      frameshift-mode: ${{ steps.frameshift.outputs.mode }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # Frameshift runs its scripts with Node. setup-node v4 caches only when
      # `cache` is set, and this step sets none.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0 # zizmor: ignore[cache-poisoning]
        with:
          node-version: "24.22.1"
      # Both projects can save a shot with the same name. Classic downloads
      # last, so the current UI's shot is the one that is compared.
      - name: Download inbox screenshots
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: dashboard-screenshots-inbox-*
          merge-multiple: true
          path: .playwright/junior-dashboard/screenshots
      - name: Download classic screenshots
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: dashboard-screenshots-classic-*
          merge-multiple: true
          path: .playwright/junior-dashboard/screenshots
      - name: Find Frameshift baseline
        if: github.event_name == 'pull_request'
        id: frameshift-baseline
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ github.token }}
        run: scripts/find-frameshift-baseline.sh
      - name: Record dashboard screenshots
        if: >-
          github.event_name != 'pull_request' ||
          steps.frameshift-baseline.outputs.found == 'true'
        id: frameshift
        uses: dcramer/frameshift/ci@d4a91aec378eb01520f0f6f0b2ad6866f67600ff # v0.2.1
        with:
          screenshots: .playwright/junior-dashboard/screenshots

  frameshift:
    name: visual / dashboard
    needs: dashboard-screenshots
    if: >-
      needs.dashboard-screenshots.outputs.frameshift-mode == 'report' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      actions: read
      contents: write
      pull-requests: write
      statuses: write
    steps:
      # This job does not check out or run pull request code.
      - uses: dcramer/frameshift/publish/workflow@d4a91aec378eb01520f0f6f0b2ad6866f67600ff # v0.2.1

  build-packages:
    name: build / packages
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.ci == 'true' || needs.changes.outputs.core == 'true' || needs.changes.outputs.dashboard == 'true' || needs.changes.outputs.plugins == 'true' || needs.changes.outputs.release == 'true' || needs.changes.outputs.full == 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-pnpm
      # The same pack procedure as the release artifacts, with its type check.
      - run: node scripts/release-artifacts.mjs pack artifacts
      - run: pnpm package-types:check

  build-example:
    name: build / example
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.ci == 'true' || needs.changes.outputs.example == 'true' || needs.changes.outputs.core == 'true' || needs.changes.outputs.full == 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-pnpm
      - run: pnpm --filter @sentry/junior-example build
        env:
          DATABASE_URL: postgres://junior:junior@localhost:5432/junior
          # Fixed CI-only key. The build loads config, which requires one.
          JUNIOR_ENCRYPTION_KEYS: ci:Wywm9DZHe0QkHOXon30I5fklwG0gdqLAzMViptFlvtI
          JUNIOR_SKIP_SNAPSHOT: "1"
          REDIS_URL: redis://localhost:6379

  docs-check:
    name: check / docs
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.ci == 'true' || needs.changes.outputs.docs == 'true' || needs.changes.outputs.core == 'true' || needs.changes.outputs.full == 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-pnpm
      - run: pnpm docs:check

  pack-release-artifacts:
    name: pack / release artifacts
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs:
      - changes
      - release-check
      - skills-check
      - lint
      - format
      - typecheck
      - junior-tests
      - eval-harness-tests
      - workspace-snapshot-lifecycle
      - plugin-tests
      - dashboard-tests
      - dashboard-e2e
      - build-packages
      - build-example
      - docs-check
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-pnpm
      - run: node scripts/release-artifacts.mjs pack artifacts

      - name: Upload release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ github.sha }}
          path: |
            artifacts/*.tgz
            artifacts/junior-release.json
          if-no-files-found: error
          retention-days: 30

  workflow-lint:
    name: lint / workflows
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.workflows == 'true' || needs.changes.outputs.full == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: false
          min-severity: medium
          version: 1.32.0

  # Pull requests only: path filters return true on every push, and ios.yml
  # runs on its own for pushes to main that change apps/ios.
  ios:
    name: ios
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.ios == 'true'
    uses: ./.github/workflows/ios.yml
    with:
      skip_ui: ${{ needs.changes.outputs.ios_app != 'true' }}

  required:
    name: ci / required
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs:
      - changes
      - release-check
      - skills-check
      - lint
      - format
      - typecheck
      - junior-tests
      - eval-harness-tests
      - workspace-snapshot-lifecycle
      - plugin-tests
      - dashboard-tests
      - dashboard-e2e
      - dashboard-screenshots
      - build-packages
      - build-example
      - docs-check
      - pack-release-artifacts
      - workflow-lint
      - ios
    if: ${{ always() && !cancelled() }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Check CI jobs
        run: scripts/check-required-ci-jobs.sh
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
