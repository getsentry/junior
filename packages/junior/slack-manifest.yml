display_information:
  name: junior
features:
  code_channels:
    enabled: true
  app_home:
    home_tab_enabled: true
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: junior
    always_online: true
  unfurl_domains:
    # Set to the dashboard host, so dashboard conversation links get previews.
    - example.com
oauth_config:
  scopes:
    bot:
      - assistant:write
      - app_mentions:read
      - canvases:read
      - canvases:write
      - channels:history
      - channels:join
      - channels:read
      - chat:write
      - dnd:read
      - files:read
      - files:write
      - groups:history
      - groups:read
      - im:history
      - im:read
      - im:write
      - links:read
      - links:write
      - lists:read
      - lists:write
      - mpim:history
      - mpim:read
      - reactions:read
      - reactions:write
      - search:read.files
      - search:read.public
      - search:read.users
      - team:read
      - users:read
      - users:read.email
settings:
  event_subscriptions:
    request_url: https://example.com/api/webhooks/slack
    bot_events:
      - app_home_opened
      - entity_details_requested
      - assistant_thread_started
      - assistant_thread_context_changed
      - agent_session_stopped
      - app_mention
      - channel_created
      - link_shared
      - message.channels
      - message.groups
      - message.im
      - message.mpim
  interactivity:
    is_enabled: true
    request_url: https://example.com/api/webhooks/slack
  socket_mode_enabled: false
