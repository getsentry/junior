# The rules of the `automation` Inbox kind (`design/inbox-kinds.md`). People
# write its code, in `alert-items.ts`.
kind: automation
source: automation
feature: inbox
hit: first
inputs:
  dismissed:
    values: bool
    description: >-
      A person dismissed an alert of the Automation after it last recovered.
      A pause is no recovery.
  state:
    values: [active, paused, blocked]
  trigger_available:
    values: bool
  last_run:
    values: [none, succeeded, failed, blocked]
  viewer.creator:
    values: bool
rules:
  - id: alert-dismissed
    serves: [alert-dismiss]
    rows:
      - when: { dismissed: true }
        output: { close: dismissed }
  - id: alert-blocked
    serves: [alert-visibility, notice-never-asks]
    rows:
      - when: { state: blocked, viewer.creator: true }
        output: { notice: { step: to fix the problem and resume it } }
  - id: alert-trigger
    serves: [alert-visibility, notice-never-asks]
    rows:
      - when: { state: active, trigger_available: false, viewer.creator: true }
        output: { notice: { step: that names the problem } }
  - id: alert-run-failed
    serves: [alert-steps]
    rows:
      - when:
          { state: active, last_run: "failed, blocked", viewer.creator: true }
        output:
          ask:
            content: an ask with the steps that fit, such as Run again and Pause
