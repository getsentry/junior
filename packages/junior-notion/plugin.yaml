name: notion
display-name: Notion
description: Notion page search, fetch, and limited write workflows

mcp:
  url: https://mcp.notion.com/mcp
  allowed-tools:
    - notion-search
    - notion-fetch
    - notion-create-pages
    - notion-update-page
    - notion-move-pages

# Optional shared read account. It has no effect until an admin connects it
# on the dashboard Admin page.
service-account:
  mcp-tools:
    - notion-search
    - notion-fetch
