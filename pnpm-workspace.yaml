packages:
  - "packages/*"
  - "apps/*"
injectWorkspacePackages: true
autoInstallPeers: false
dedupePeerDependents: false
catalog:
  "@earendil-works/pi-agent-core": 1.5.2
  "@earendil-works/pi-ai": 1.5.2
  "@sentry/browser": 11.16.0
  "@sentry/nitro": 11.16.0
  "@sentry/node": 11.16.0
  "@sentry/server-utils": 11.16.0
  "@sentry/starlight-theme": ^0.9.1
  # Markdown parsing, shared by the plugin API helpers and the plugins.
  "@types/mdast": ^4.0.4
  # Node 24 is the supported runtime in development, CI, and deployments.
  "@types/node": ^24.19.2
  "@vitest/coverage-v8": 4.1.12
  drizzle-kit: 1.0.0-rc.6
  drizzle-orm: 1.0.0-rc.6
  mdast-util-from-markdown: ^2.1.0
  mdast-util-gfm: ^3.1.0
  micromark-extension-gfm: ^3.0.0
  p-limit: ^7.3.3
  tsdown: 0.23.7
  typescript: 7.0.2
  vitest: ^4.1.12
  zod: ^4.6.7
overrides:
  "@astrojs/compiler-binding-wasm32-wasi>@napi-rs/wasm-runtime": 1.2.0
  "@bruits/satteri-wasm32-wasi>@napi-rs/wasm-runtime": 1.2.0
  "@slack/types": 3.3.0
  ai: 7.0.153
  "astro>vite": 8.0.14
  "@swc/core": 1.15.33
  linkify-it: 5.0.0
  tinyexec: 1.1.2
  tldts: 7.0.30
  ws: 8.20.1
  yaml: ^2.9.0
packageExtensions:
  dependency-cruiser:
    dependencies:
      # TypeScript 7 has no compiler API. dependency-cruiser needs it to parse
      # TypeScript sources, and finds no TypeScript files without it.
      typescript: npm:@typescript/typescript6@6.0.2
peerDependencyRules:
  allowedVersions:
    vitest-evals>ai: ">=4"
    vitest-evals>zod: ">=3"
syncInjectedDepsAfterScripts:
  - build
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - "@sentry/starlight-theme"
  - "@vitest-evals/core@0.16.1"
  - "@vitest-evals/report-ui@0.16.1"
  - "vitest-evals@0.16.1"
  - "@sentry/browser@11.16.0"
  - "@sentry/browser-utils@11.16.0"
  - "@sentry/bundler-plugins@11.16.0"
  - "@sentry/core@11.16.0"
  - "@sentry/feedback@11.16.0"
  - "@sentry/nitro@11.16.0"
  - "@sentry/node@11.16.0"
  - "@sentry/opentelemetry@11.16.0"
  - "@sentry/replay@11.16.0"
  - "@sentry/replay-canvas@11.16.0"
  - "@sentry/server-runtime-injection@11.16.0"
  - "@sentry/server-utils@11.16.0"
  # Sentry publishes @sentry/api, so a new release is trusted.
  - "@sentry/api@3.2.0"
  - "@earendil-works/pi-agent-core"
  - "@earendil-works/pi-ai"
  - sentry
  - zod@4.5.4
allowBuilds:
  "@ast-grep/cli": true
  "@google/genai": true
  "@mongodb-js/zstd": true
  "@parcel/watcher": true
  agent-browser: true
  esbuild: true
  msw: true
  node-liblzma: false
  protobufjs: true
  sharp: true
  simple-git-hooks: true
patchedDependencies:
  # Backports getsentry/sentry-javascript#26666 (`db.response.returned_rows` on pg and Neon
  # query spans). Drop this patch when Junior bumps to an SDK release that includes it.
  "@sentry/server-utils@11.16.0": patches/@sentry__server-utils@11.16.0.patch
