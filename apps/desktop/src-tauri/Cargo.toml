[package]
name = "junior-desktop"
version = "0.1.0"
description = "Junior desktop app"
edition = "2021"
publish = false

[lib]
name = "junior_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
base64 = "0.23"
cookie = "0.18"
getrandom = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls"] }
sentry = "0.49.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2.12", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-sentry = "0.9"
tokio = { version = "1", features = ["io-util", "net", "time"] }
