name: Junior
options:
  bundleIdPrefix: io.sentry.junior
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig
fileGroups:
  - README.md
  - project.yml
  - Makefile
  - Brewfile
  - Brewfile.ci
  - Gemfile
  - Gemfile.lock
  - .ruby-version
  - .swift-format
  - fastlane/Appfile
  - fastlane/Fastfile
  - fastlane/Matchfile
  - scripts
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    # The server release version. scripts/bump-release-versions.mjs sets it.
    MARKETING_VERSION: "0.316.0"
    CURRENT_PROJECT_VERSION: "1"
    # Ad-hoc "Sign to Run Locally" for the simulator, so the Keychain works.
    "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
packages:
  JuniorKit:
    path: Packages/JuniorKit
targets:
  Junior:
    type: application
    platform: iOS
    sources:
      - path: Junior
      # Craft's changelog of each release. The drawer's Changelog reads its
      # iOS entries from the app bundle.
      - path: ../../CHANGELOG.md
        buildPhase: resources
    dependencies:
      - package: JuniorKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(JUNIOR_BUNDLE_ID)
        PRODUCT_NAME: Junior
        # iPhone and iPad.
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Junior/Info.plist
      properties:
        CFBundleDisplayName: Junior
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # `beta` or `rc`, and the short git commit, which the TestFlight lane
        # sets (fastlane/Fastfile). Local builds leave them empty. The idea
        # comes from inject-git-info in armcknight/tools.
        JuniorChannel: $(JUNIOR_CHANNEL)
        JuniorCommit: $(JUNIOR_COMMIT)
        # Only standard HTTPS, so TestFlight asks no export-compliance question.
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSupportsIndirectInputEvents: true
        # More than one window on iPad, each with its own navigation.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        # iPhone Duo turns content with each pose, so iPhone rotates too.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Every orientation, which iPad multitasking requires.
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIAppFonts:
          - InterVariable.ttf
          - OutfitVariable.ttf
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UILaunchScreen:
          UIColorName: LaunchBackground
  JuniorUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: JuniorUITests
    dependencies:
      - target: Junior
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(JUNIOR_BUNDLE_ID).uitests
        TEST_TARGET_NAME: Junior
        GENERATE_INFOPLIST_FILE: "YES"
schemes:
  Junior:
    build:
      targets:
        Junior: all
    run:
      config: Debug
  JuniorUITests:
    build:
      targets:
        JuniorUITests: [test]
    test:
      config: Debug
      targets:
        - JuniorUITests
