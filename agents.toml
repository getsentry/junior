version = 1
# Skills always fetch the latest version; lockfile tracks names only.
agents = ["claude", "codex", "cursor"]

[trust]
allow_all = true

[[mcp]]
name = "sentry"
command = "sentry"
args = ["mcp", "sentry/junior", "--experimental"]

[[skills]]
name = "chat-sdk"
source = "vercel/chat"

[[skills]]
name = "ai-sdk"
source = "vercel/ai"

[[skills]]
name = "agent-browser"
source = "vercel-labs/agent-browser"
